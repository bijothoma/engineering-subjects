<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 1 — Foundations &amp; Divide and Conquer</title><link rel="stylesheet" href="../assets/style.css"></head><body><main><nav class="bc" aria-label="Breadcrumb"><a href="../../../index.html">Home</a><span>›</span><a href="../index.html">Design and Analysis of Algorithms</a><span>›</span><a href="../index.html#quizzes">Quizzes</a><span>›</span><b aria-current="page">Quiz 1 — Foundations &amp; Divide and Conquer</b></nav><h1>Quiz 1 — Foundations &amp; Divide and Conquer</h1><div id="app"></div></main>
<script>window.QUIZ={title:"Quiz 1 — Foundations & Divide and Conquer",topic:"T1",items:[
{q:"Binary search on a sorted array of 1,000,000 elements needs at most how many iterations (3-way comparison, unsuccessful search)?",opts:["1,000,000","20","500,000","10"],ans:1,why:"Each iteration halves the range, so at most ⌊log₂ n⌋ + 1 = ⌊19.93⌋ + 1 = 20. 10 would be right for n = 1000, not 10^6. n/2 or n would be a linear scan."},
{q:"Which recurrence describes merge sort, and what is its solution?",opts:["T(n) = T(n/2) + Θ(n) ⇒ Θ(n)","T(n) = 2T(n/2) + Θ(1) ⇒ Θ(n)","T(n) = 2T(n−1) + Θ(n) ⇒ Θ(2ⁿ)","T(n) = 2T(n/2) + Θ(n) ⇒ Θ(n log n)"],ans:3,why:"Two half-size sorts plus a linear merge: a = 2, b = 2, d = 1 = log₂2, balanced case ⇒ Θ(n log n). T(n/2)+n would mean only one half is sorted; a Θ(1) combine ignores the linear merge; n−1 splitting is not halving."},
{q:"In A = [1,2,2,2,3,5], what does a lower-bound search (first index i with A[i] ≥ 2) return?",opts:["1","0","3","4"],ans:0,why:"Index 1 is the first 2, so LowerBound = 1. Index 3 is the last 2, and 4 is UpperBound (first element &gt; 2). Index 0 holds 1, which is &lt; 2."},
{q:"Master theorem: solve T(n) = 4T(n/2) + n.",opts:["Θ(n)","Θ(n log n)","Θ(n²)","Θ(n² log n)"],ans:2,why:"a = 4, b = 2, d = 1 and log₂4 = 2 &gt; d, so the leaves dominate: Θ(n²). Θ(n) would need d &gt; log_b a; Θ(n log n) is the balanced case for d = 1 = log_b a (a = 2); Θ(n² log n) needs d = 2."},
{q:"Why can no comparison-based sorting algorithm beat Ω(n log n) in the worst case?",opts:["Each element must be compared with every other element","The decision tree needs n! leaves, so its height is ≥ log₂(n!) = Ω(n log n)","Sorting needs at least n log n swaps","Merge sort is the fastest known algorithm"],ans:1,why:"Each of the n! orderings needs its own leaf in a binary tree, so height ≥ log₂ n!. Comparing all pairs would give n², which is not required (merge sort does fewer). Swap count is irrelevant, and “fastest known” is not a proof."},
{q:"What is the minimum worst-case number of comparisons any comparison sort needs for 8 elements (information-theoretic bound)?",opts:["16","8","40320","3"],ans:0,why:"⌈log₂ 8!⌉ = ⌈log₂ 40320⌉ = ⌈15.3⌉ = 16. 40320 is the leaf count, not the height; 3 = log₂ 8 and 8 are far too small."},
{q:"Which statement about Quicksort is correct?",opts:["Quicksort is always Θ(n log n)","Quicksort is stable","Quicksort needs Θ(n) extra array space for partitioning","With first/last pivot, an already sorted array gives Θ(n²)"],ans:3,why:"A sorted input makes every partition (n−1, 0), so T(n) = T(n−1) + n = Θ(n²). The Θ(n log n) bound holds only on average / with a random pivot. Partitioning swaps non-adjacent elements, so it is not stable, and Lomuto/Hoare partitioning works in place."},
{q:"Lomuto partition (pivot = last element, scan with A[j] ≤ pivot) is applied to [7,2,9,4,3,8,5]. The array afterwards is:",opts:["[2,4,3,5,7,8,9]","[2,3,4,5,7,9,8]","[2,4,3,5,9,8,7]","[7,2,4,3,5,9,8]"],ans:2,why:"Pivot 5. j=1 (2) swaps with index 0 → [2,7,9,4,3,8,5]; j=3 (4) swaps with index 1 → [2,4,9,7,3,8,5]; j=4 (3) swaps with index 2 → [2,4,3,7,9,8,5]; 9 and 8 are skipped. Finally the pivot swaps with index 3 → [2,4,3,5,9,8,7]. The other options are fully sorted or not reachable by this procedure; Lomuto does not sort the right block."},
{q:"The expected number of comparisons in randomized Quicksort is about:",opts:["n²/2","2n ln n","n","n log₂ n − n + 1 exactly"],ans:1,why:"Σ over pairs of 2/(j−i+1) ≈ 2n ln n ≈ 1.39 n log₂ n. n²/2 is the worst case; n is the order of Quickselect; n log₂ n − n + 1 is merge sort’s worst case for n a power of 2."},
{q:"In randomized Quicksort, what is the probability that the elements of rank 3 and rank 7 are ever compared?",opts:["2/5","1/5","1/2","2/7"],ans:0,why:"They are compared iff one of them is the first pivot chosen among ranks 3..7 (5 elements): 2/(7−3+1) = 2/5. 1/5 counts only one of them; 2/7 uses the wrong range size."},
{q:"Quickselect with a random pivot has what expected and worst-case running time?",opts:["Θ(n log n) expected, Θ(n²) worst","Θ(n) in both cases","Θ(n) expected, Θ(n²) worst","Θ(log n) expected, Θ(n) worst"],ans:2,why:"A good pivot leaves ≤ 3n/4 elements, so the expected work is a geometric series O(n). Only one side is recursed (unlike Quicksort, so not n log n); repeatedly bad pivots give Θ(n²); partitioning costs Θ(n) so log n is impossible."},
{q:"The median-of-medians algorithm uses groups of 5 because:",opts:["5 elements can be sorted in O(1) comparisons so no recursion is needed","Groups of 3 would be incorrect","It makes the algorithm in-place","T(n) = T(n/5) + T(7n/10) + O(n) and 1/5 + 7/10 &lt; 1 gives O(n)"],ans:3,why:"The pivot discards ≥ about 3n/10 elements, so the fractions 1/5 + 7/10 = 9/10 &lt; 1 ⇒ linear. Sorting 5 elements is O(1) but that is not the reason. Groups of 3 are still correct but give T(n/3) + T(2n/3) + n = Θ(n log n). The algorithm is not in-place by design."},
{q:"How many multiplications does square-and-multiply use to compute 3^13 (13 = 1101₂)?",opts:["5","12","4","6"],ans:0,why:"Starting from 3¹: bit 1 → square, multiply (3³); bit 0 → square (3⁶); bit 1 → square, multiply (3¹³): 2 + 1 + 2 = 5 multiplications (3^13 = 1,594,323). 12 is the naive count; 4 is what 5^10 needs; 6 is what 2^15 needs."},
{q:"A student implements Power(a,n) as Power(a,n/2) * Power(a,n/2) (two recursive calls) for even n. The running time is:",opts:["Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)"],ans:1,why:"T(n) = 2T(n/2) + Θ(1) ⇒ Θ(n) by the master theorem (log₂2 = 1 &gt; 0). The log n bound needs a single recursive call whose result is squared."},
{q:"Block-recursive matrix multiplication with 8 half-size products has what complexity, and how does Strassen improve it?",opts:["Θ(n²); Strassen reduces it to Θ(n)","Θ(n^2.807); Strassen uses 8 additions","Θ(n³); Strassen uses 7 products ⇒ Θ(n^2.807)","Θ(n³ log n); Strassen gives Θ(n³)"],ans:2,why:"8T(n/2) + n² ⇒ n^(log₂8) = n³. Strassen trades one multiplication for extra additions: 7T(n/2) + n² ⇒ n^(log₂7) ≈ n^2.807. The output has n² entries, so Θ(n) is impossible."},
{q:"For n = 1024 (a power of 2) with a 1×1 base case, how many scalar multiplications do Strassen and the 8-product block recursion use, respectively?",opts:["7×1024 and 8×1024","1024³ and 1024²","7^1024 and 8^1024","7^10 = 282,475,249 and 8^10 = 1,073,741,824"],ans:3,why:"The recursion depth is log₂1024 = 10 and each level multiplies the number of subproblems by 7 (or 8). The other options mis-state the number of levels or swap the roles of the two methods."},
{q:"What is the maximum subarray sum of [−2,1,−3,4,−1,2,1,−5,4]?",opts:["6","5","7","4"],ans:0,why:"The best is [4,−1,2,1] = 6. Extending with −5,4 gives 5; [4] alone is 4; 7 is not achievable by any contiguous block."},
{q:"Which part of the divide-and-conquer maximum subarray algorithm is easiest to forget, producing wrong answers?",opts:["The single-element base case","The subarray crossing the midpoint","Sorting the input first","Stopping when the array is empty"],ans:1,why:"The best subarray might straddle the midpoint, so max(left, right, cross) is required. Sorting would destroy contiguity and is never done; the base case is routinely handled."},
{q:"How many inversions does [5,3,2,4,1] have?",opts:["7","10","8","6"],ans:2,why:"Pairs i&lt;j with A[i] &gt; A[j]: from 5: 4 (3,2,4,1); from 3: 2 (2,1); from 2: 1 (1); from 4: 1 (1) ⇒ 8. 10 = C(5,2) would be a reversed array."},
{q:"During the merge step of inversion counting, L = [3,8,10] and R = [1,9]. What is the total number of cross inversions counted?",opts:["2","3","5","4"],ans:3,why:"1 is output while 3 elements remain in L ⇒ +3. Then 3 and 8 are output, and 9 is output while only 10 remains in L ⇒ +1. Total 4: (3,1),(8,1),(10,1),(10,9). Counting only the first step gives 3; counting each R element once gives 2."},
{q:"In the closest-pair algorithm, why is it enough to compare each strip point only with the next constant number (7) of points in y-order?",opts:["The strip always contains at most 8 points","A d × 2d rectangle can hold at most 8 points that are pairwise at least d apart","Points in the strip are already sorted by x","Distances greater than d are impossible inside the strip"],ans:1,why:"Packing argument: split the rectangle into eight d/2 × d/2 cells; each holds at most one point because same-side pairs are ≥ d apart. The strip itself may hold up to n points. Strip points are ordered by y, not x. Distances inside the strip can exceed d; such pairs simply do not matter."},
{q:"The closest-pair algorithm runs in Θ(n log n) only if:",opts:["the y-sorted order is maintained by merging rather than re-sorting at each level","points are given in sorted y-order initially","the points are collinear","the strip is checked with a double loop over all pairs"],ans:0,why:"Re-sorting the strip at every level gives T(n) = 2T(n/2) + n log n = Θ(n log² n). Merging the y-order is linear. A double loop over the strip is Θ(n²) in the worst case."},
{q:"Solve T(n) = 2T(n/2) + n log n.",opts:["Θ(n log n)","Θ(n²)","Θ(n)","Θ(n log² n)"],ans:3,why:"f(n) = n^(log₂2) · log¹ n (k = 1) ⇒ Θ(n · log^(k+1) n) = Θ(n log² n). Each of the log n levels costs about n log n, so total ≈ n log² n / 2. The plain master theorem (polynomial gap) does not apply, and it is not Θ(n log n) because every level contributes a log factor."},
{q:"Evaluate T(n) = 2T(n/2) + n with T(1) = 0 at n = 1024.",opts:["1024","20480","10240","5120"],ans:2,why:"Unrolling gives n log₂ n = 1024 × 10 = 10240 (check: T(16) = 64 = 16 × 4). 1024 forgets the log n levels, 20480 doubles, 5120 halves the per-level cost."},
{q:"Which of the following algorithms is NOT subject to the Ω(n log n) comparison-sorting lower bound?",opts:["Merge sort","Counting sort on integers in [0, k] with k = O(n)","Heap sort","Randomized quicksort"],ans:1,why:"Counting sort indexes by key value and never compares two elements, so the decision-tree argument does not apply: O(n + k). The other three are comparison sorts and are bounded below by Ω(n log n) in the worst case (quicksort expected)."},
{q:"To count the occurrences of key x in a sorted array of n elements in O(log n), the best approach is:",opts:["UpperBound(x) − LowerBound(x)","Binary search once, then scan left and right","Sort and count","Quickselect the median"],ans:0,why:"Two binary searches cost O(log n). Scanning from a single hit can cost Θ(n) when all elements equal x. Sorting is redundant (already sorted); the median is unrelated."},
{q:"Which recurrence has the asymptotically largest solution?",opts:["T(n) = 9T(n/3) + n² ⇒ Θ(n² log n)","T(n) = 2T(n/2) + n ⇒ Θ(n log n)","T(n) = 7T(n/2) + n² ⇒ Θ(n^2.807)","T(n) = T(n−1) + 1 ⇒ Θ(n)"],ans:2,why:"The Strassen recurrence gives n^(log₂7) ≈ n^2.807, polynomially larger than n² log n (9T(n/3) + n² is the balanced case: log₃9 = 2). n log n and n are smaller still."},
{q:"Karatsuba multiplies two n-digit integers using three half-size products. Its running time is:",opts:["T(n) = 4T(n/2) + Θ(n) = Θ(n²)","T(n) = 3T(n/2) + Θ(n²) = Θ(n²)","T(n) = 2T(n/2) + Θ(n) = Θ(n log n)","T(n) = 3T(n/2) + Θ(n) = Θ(n^1.585)"],ans:3,why:"a = 3, b = 2, d = 1: log₂3 ≈ 1.585 &gt; 1 ⇒ Θ(n^1.585). Four products give the grade-school Θ(n²); a quadratic combine would erase the gain; two products are not enough to get the middle term, so n log n is unattainable this way."},
{q:"Which design choice would make median-of-medians lose its worst-case linear time?",opts:["Using groups of 3 instead of 5","Using groups of 7 instead of 5","Partitioning iteratively instead of recursively","Sorting each group of 5 by insertion sort"],ans:0,why:"Groups of 3 give T(n) ≤ T(n/3) + T(2n/3) + cn = Θ(n log n) because 1/3 + 2/3 = 1. Groups of 7 give 1/7 + 5/7 &lt; 1 (still linear). Iterative partition and insertion-sorting a constant-size group are only constant-factor changes."},
{q:"Which method best fits “find the maximum subarray sum of an n-element array in the least time”?",opts:["D&amp;C with cross sum, O(n log n)","Kadane’s linear scan: cur = max(A[i], cur + A[i]), O(n)","Brute force over all pairs with prefix sums, O(n²)","Sort the array and add the positives"],ans:1,why:"Kadane is optimal at Θ(n) since every element must be read. D&amp;C is correct but slower; brute force slower still. Sorting loses contiguity, so it solves a different problem."}
]};</script><script src="../assets/quiz.js"></script></body></html>
