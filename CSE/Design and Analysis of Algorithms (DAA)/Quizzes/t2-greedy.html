<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 2 — Greedy Algorithms</title><link rel="stylesheet" href="../assets/style.css"></head><body><main><nav class="top"><a href="../index.html">← Home</a></nav><h1>Quiz 2 — Greedy Algorithms</h1><div id="app"></div></main>
<script>window.QUIZ={items:[{"q":"Which two properties must a problem have for a greedy algorithm to be provably optimal?","opts":["Overlapping subproblems and optimal substructure","Greedy-choice property and optimal substructure","Greedy-choice property and overlapping subproblems","Divide-and-conquer recurrence and polynomial input size"],"ans":1,"why":"Greedy needs (1) the greedy-choice property: some optimal solution contains the locally best first choice, and (2) optimal substructure: what remains after that choice is a smaller instance of the same problem. Overlapping subproblems is the signature of dynamic programming, not greedy; greedy never revisits subproblems."},{"q":"Which statement about greedy algorithms is TRUE?","opts":["A locally optimal choice at every step always yields a globally optimal solution","They always run in linear time because there is no search","They are only applicable to graph problems","They commit to a choice and never reconsider it; correctness must be proved (e.g. by an exchange argument)"],"ans":3,"why":"Greedy never backtracks, so a proof is mandatory: for many problems (0/1 knapsack, coin change with arbitrary denominations) locally best choices are NOT globally optimal. Greedy runs are often dominated by sorting or a heap (O(n log n)), and they apply to scheduling, coding, knapsack, etc., not only graphs."},{"q":"For interval scheduling (maximise the number of mutually compatible intervals), which greedy rule is optimal?","opts":["Always pick the compatible interval with the earliest finish time","Always pick the compatible interval with the earliest start time","Always pick the shortest compatible interval","Always pick the interval that conflicts with the fewest others"],"ans":0,"why":"Earliest finish leaves the maximum room for the remaining intervals; an exchange argument proves optimality. Earliest start fails when a long interval starts first and blocks many short ones; shortest-first fails when a short interval straddles two long compatible ones; fewest-conflicts also has known counterexamples."},{"q":"Intervals (start,end): (1,4),(3,5),(0,6),(5,7),(3,9),(5,9),(6,10),(8,11),(8,12),(2,14),(12,16). The earliest-finish-time greedy selects how many intervals? (Intervals sharing only an endpoint are compatible.)","opts":["3","5","4","6"],"ans":2,"why":"Sorted by finish: (1,4) taken; (3,5) start 3&lt;4 skip; (0,6) skip; (5,7) start 5≥4 taken; (3,9),(5,9) skip; (6,10) 6&lt;7 skip; (8,11) 8≥7 taken; (8,12) skip; (2,14) skip; (12,16) 12≥11 taken. Selected: (1,4),(5,7),(8,11),(12,16) = 4. Taking (6,10), or forgetting that touching endpoints are compatible, gives wrong counts."},{"q":"What is the running time of the earliest-finish-time interval scheduling algorithm on n intervals?","opts":["O(n), because only one pass is needed","O(n log n), dominated by sorting; the selection scan is O(n)","O(n²), because each interval is compared with all chosen ones","O(2ⁿ), since all subsets must be considered"],"ans":1,"why":"Sort by finish time in O(n log n), then one scan comparing each start with the finish time of the last chosen interval, O(n). Total O(n log n). It is not O(n) overall because of the sort, and no subset enumeration or pairwise comparison is needed."},{"q":"Fractional knapsack: items (value, weight) = (60,10), (100,20), (120,30), capacity W = 50. What is the maximum value?","opts":["220","160","280","240"],"ans":3,"why":"Ratios 6, 5, 4. Take item 1 (10) and item 2 (20), total weight 30, value 160; the remaining 20 units of item 3 give 120·20/30 = 80. Total 240. 220 is the optimum of the 0/1 version (items 2 and 3); 160 stops before using the leftover capacity."},{"q":"What is the optimal greedy strategy for the fractional knapsack problem, and its complexity?","opts":["Take items in decreasing value/weight ratio, splitting the last one; O(n log n)","Take items in decreasing value; O(n log n)","Take items in increasing weight; O(n log n)","Take items in decreasing ratio but never split; O(n)"],"ans":0,"why":"Decreasing value-per-unit-weight is optimal because every unit of capacity should hold the best remaining density (exchange argument). Sorting by value alone or weight alone ignores the other quantity. Forbidding splitting is the 0/1 problem, where ratio-greedy is not optimal."},{"q":"The cut property for minimum spanning trees says:","opts":["For any cut, every edge crossing it belongs to the MST","The heaviest edge of every cycle is in the MST","For any cut, a minimum-weight edge crossing the cut belongs to some MST","Every MST contains the lightest edge incident to each vertex and nothing else"],"ans":2,"why":"Cut property: for any partition (S, V−S), a lightest edge crossing it is in some MST (in every MST if it is the unique lightest). Both Prim and Kruskal are justified by it. The heaviest edge of a cycle is the opposite statement (cycle property): it is excluded, not included."},{"q":"Graph edges: A-B 4, A-C 2, B-C 1, B-D 5, C-D 8, C-E 10, D-E 2, D-F 6, E-F 3. What is the weight of the MST?","opts":["15","13","11","16"],"ans":1,"why":"Kruskal in order: B-C 1, A-C 2, D-E 2, E-F 3 (all accepted), A-B 4 (rejected: A and B already connected through C), B-D 5 (accepted, joins {A,B,C} with {D,E,F}). Five edges for six vertices: 1+2+2+3+5 = 13. Using C-D 8 instead of B-D 5 gives 16; taking A-B 4 would close a cycle."},{"q":"What is the time complexity of Kruskal's algorithm using sorting and union–find with path compression and union by rank?","opts":["O(V²)","O(V + E), since union–find is almost constant time","O(E·V)","O(E log E) = O(E log V), dominated by sorting the edges"],"ans":3,"why":"Sorting costs O(E log E), and since E ≤ V², log E = O(log V). The E find/union operations cost O(E α(V)), which is smaller. O(V+E) would need pre-sorted edges. O(V²) is the array version of Prim."},{"q":"Run Prim's algorithm from A on the same graph (A-B 4, A-C 2, B-C 1, B-D 5, C-D 8, C-E 10, D-E 2, D-F 6, E-F 3). In which order are vertices added to the tree?","opts":["A, C, B, D, E, F","A, B, C, D, E, F","A, C, B, D, F, E","A, C, D, B, E, F"],"ans":0,"why":"From {A}: cheapest crossing edge is A-C 2, so C. Then B-C 1, so B. Then crossing edges are B-D 5, C-D 8, C-E 10: D via B-D 5. Then D-E 2 gives E, then E-F 3 gives F. Order A,C,B,D,E,F, total 13. Starting with A-B 4 ignores that Prim always takes the lightest edge leaving the current tree."},{"q":"Prim's algorithm with a binary min-heap on a graph with V vertices and E edges runs in:","opts":["O(V²)","O(E + V)","O(E log V)","O(V log V) regardless of E"],"ans":2,"why":"Each edge may trigger a decrease-key/insert costing O(log V), giving O(E log V). O(V²) is the simple array/adjacency-matrix implementation (better for dense graphs). A Fibonacci heap gives O(E + V log V). The E term can never be dropped since every edge must be examined."},{"q":"A connected weighted graph has n vertices and all edge weights are distinct. Which statement is correct?","opts":["It has exactly n MSTs","Its MST is unique and has exactly n−1 edges","Its MST has n edges","Its MST may not be unique, but has n−1 edges"],"ans":1,"why":"Any spanning tree has n−1 edges. With distinct weights, the lightest edge across every cut is unique, so the cut property forces a unique MST. Non-uniqueness can only arise when equal weights create ties."},{"q":"If a cycle has a strictly heaviest edge e (heavier than every other edge on the cycle), then:","opts":["e belongs to every MST","e belongs to the MST only if it is a bridge","Nothing can be said without running Kruskal","e belongs to no MST"],"ans":3,"why":"Cycle property: removing e from a spanning tree containing it and reconnecting with another cycle edge yields a strictly lighter tree, so no MST contains e. A bridge lies on no cycle, so that case does not apply. Kruskal never accepts e because the other cycle edges are processed first."},{"q":"Huffman coding on frequencies a:5, b:9, c:12, d:13, e:16, f:45. What is the total weighted code length Σ freq·depth?","opts":["224","100","225","196"],"ans":0,"why":"Merges: 5+9=14, 12+13=25, 14+16=30, 25+30=55, 45+55=100. The cost equals the sum of all internal-node weights: 14+25+30+55+100 = 224. 100 is just the total frequency (the root weight), not the cost. A fixed 3-bit code would cost 300."},{"q":"In the Huffman tree built for a:5, b:9, c:12, d:13, e:16, f:45, the codeword for f is:","opts":["2 bits long","3 bits long","1 bit long","as long as the codeword of a"],"ans":2,"why":"f (45) is merged last with the combined node of weight 55, so it is a child of the root at depth 1. Highest-frequency symbols get the shortest codes; a (frequency 5) is at depth 4, so its code is longer."},{"q":"Huffman is run on frequencies 1,1,2,3,5,8,13,21 (Fibonacci numbers). What is the length of the longest codeword?","opts":["3 bits","7 bits","4 bits","8 bits"],"ans":1,"why":"Merges give 2, then 2+2=4, 3+4=7, 5+7=12, 8+12=20, 13+20=33, 21+33=54. Each new node is among the two smallest at the next step, so the tree is a degenerate chain of depth n−1 = 7 for the two rarest symbols. A balanced 3-bit shape is what a uniform distribution would give, not Fibonacci."},{"q":"The time complexity of Huffman's algorithm for n symbols using a binary min-heap is:","opts":["O(n)","O(n²) always","O(n log² n)","O(n log n)"],"ans":3,"why":"There are n−1 merges; each does two extract-mins and one insert, each O(log n): total O(n log n). It is O(n) only if the frequencies are already sorted and two queues are used. O(n²) is the naive linear-scan version, not the heap version."},{"q":"Which of these codes is NOT a valid prefix code?","opts":["a=0, b=10, c=110, d=11","a=0, b=10, c=110, d=111","a=00, b=01, c=10, d=11","a=1, b=01, c=001, d=000"],"ans":0,"why":"In the set a=0, b=10, c=110, d=11, the codeword d=11 is a prefix of c=110, so the bit string 110 is ambiguous. The other sets have no codeword that is a prefix of another (all codewords are leaves of a binary tree). Huffman codes are always prefix codes because symbols sit only at leaves."},{"q":"Greedy Maximum Independent Set on a tree: repeatedly pick a leaf, add it to the set, delete it and its neighbour. Tree edges: 1-2, 1-3, 1-4, 2-5, 2-6, 4-7. What size set results?","opts":["3","5","4","7"],"ans":2,"why":"Leaves are 3,5,6,7. Pick 5 (delete 5 and 2); 6 is now isolated, pick 6; pick 3 (delete 3 and 1); pick 7 (delete 7 and 4). The set {5,6,3,7} has size 4, which is the maximum (a set containing 1 loses 2,3,4 and gets at most {1,5,6,7} = 4). Size 5 or 7 would need adjacent vertices."},{"q":"Why is it safe to include a leaf in a maximum independent set of a tree?","opts":["Because leaves have the highest degree","Exchange: if an optimal set omits the leaf, it contains the leaf's only neighbour, which can be swapped for the leaf at no loss","Because leaves are always adjacent to the root","Because a leaf has weight zero"],"ans":1,"why":"If an optimal solution omits the leaf ℓ, it must contain ℓ's only neighbour p (otherwise ℓ could be added). Replacing p by ℓ keeps independence and the same size. So some optimal solution contains ℓ. Leaves have the LOWEST degree (1), and the argument has nothing to do with the root or weights."},{"q":"Which statement about the leaf-picking greedy for Maximum Independent Set is correct?","opts":["It is optimal on all graphs","It is optimal on no graph","It is optimal only for complete graphs and runs in O(n³)","It is optimal on trees (O(n)) but not valid for general graphs, where MIS is NP-hard"],"ans":3,"why":"In a tree there is always a leaf with a single neighbour, which drives the exchange argument. General graphs may have no degree-1 vertex (e.g. a cycle), and the problem is NP-hard, so no known greedy is exact. It also works on forests."},{"q":"Which of these is a valid counterexample showing that 'earliest start time first' is NOT optimal for interval scheduling?","opts":["(0,10), (1,2), (3,4), (5,6): greedy picks 1 interval but 3 fit","(1,2), (3,4), (5,6): greedy picks 2 intervals but 3 fit","(0,5), (5,10): greedy picks 1 interval but 2 fit","(1,3), (2,4): greedy picks 1 interval but 2 fit"],"ans":0,"why":"Earliest start picks (0,10) first, which blocks the three short intervals; the optimum is 3. In the set (1,2),(3,4),(5,6), greedy picks all 3. In (0,5),(5,10), touching intervals are compatible, so greedy picks both. In (1,3),(2,4), the two intervals overlap, so only 1 fits."},{"q":"Coin denominations {1, 3, 4}, target 6. The greedy 'largest coin first' uses ___ coins whereas the optimum uses ___.","opts":["2 and 2","3 and 3","3 (4+1+1) and 2 (3+3)","2 and 3"],"ans":2,"why":"Largest-first takes 4, then the remaining 2 forces 1+1: 3 coins. 3+3 uses only 2. So greedy fails for arbitrary denominations (it works for canonical systems like 1,5,10,25 or powers of 2). This is a classic problem needing dynamic programming."},{"q":"All edge weights of a connected graph are positive and every weight w is replaced by w². Compared with the original graph:","opts":["Both MSTs and shortest paths are unchanged","The set of MSTs is unchanged but shortest paths may change","Both MSTs and shortest paths may change","The MST changes but shortest paths are unchanged"],"ans":1,"why":"Kruskal/Prim only compare edge weights, and squaring positive numbers preserves their order, so the same MST is found. A path's weight is a SUM, and sums need not keep their order: a direct edge of weight 3 beats a path 2+2 = 4, but after squaring 9 &gt; 4+4 = 8, so the shortest path flips."},{"q":"In Kruskal's algorithm, which operation does the union–find structure replace?","opts":["Sorting the edges","Finding the minimum-weight edge leaving the tree","Computing the shortest path","Cycle detection: testing whether the two endpoints of an edge are already connected"],"ans":3,"why":"find(u) = find(v) means the edge would close a cycle and is skipped; otherwise union merges the components. Sorting is done separately up front; 'minimum edge leaving the tree' is Prim's job; shortest paths are Dijkstra's."},{"q":"Huffman's algorithm is run on 100 symbols. How many internal nodes (merge steps) does the final tree have?","opts":["99","100","101","50"],"ans":0,"why":"Each merge reduces the number of trees by 1, from 100 trees down to 1, so 99 merges; a full binary tree with n leaves has n−1 internal nodes. Not n, and not n/2 (that would be a single level of pairing)."},{"q":"For a dense graph with V vertices and E ≈ V² edges, which MST implementation is asymptotically best among the listed?","opts":["Kruskal with sorting, O(V² log V)","Prim with a binary heap, O(V² log V)","Prim with an array: O(V²), better than Kruskal's O(E log V) = O(V² log V)","They are all identical, Θ(V²)"],"ans":2,"why":"Array-based Prim scans for the minimum key in O(V) per step: O(V²) total. With E ≈ V², Kruskal and heap-based Prim carry an extra log V factor. So they are not all identical."},{"q":"Which statement correctly contrasts Prim's and Kruskal's algorithms?","opts":["Prim is greedy but Kruskal is dynamic programming","Prim grows one tree; Kruskal grows a forest and merges components; both produce an MST","Prim works only on trees and Kruskal on cycles","Kruskal needs a priority queue; Prim needs union–find"],"ans":1,"why":"Prim maintains a single tree and adds the lightest edge leaving it; Kruskal keeps many components and merges them via the lightest globally safe edge. Both are greedy, both justified by the cut property. The data structures are the other way round: Prim uses a priority queue, Kruskal uses union–find."},{"q":"Fractional knapsack with capacity W = 60 and items (value, weight): (30,5), (40,10), (45,15), (77,22), (90,25). What is the maximum value?","opts":["197","237","280","230"],"ans":3,"why":"Ratios: 6, 4, 3, 3.5, 3.6. Descending: (30,5), (40,10), (90,25) [3.6], (77,22) [3.5], (45,15) [3]. Take the first three whole: weight 40, value 160; 20 units remain, so 20/22 of item (77,22) = 70. Total 230. Taking (45,15) ahead of the 3.5 item, or not splitting, gives a smaller value."}]};</script><script src="../assets/quiz.js"></script></body></html>
