<script>window.EXAM={instructions:["Answer ALL questions. Part A: 8 × 2 = 16; Part B: 3 × 4 = 12; Part C: 3 × 4 = 12. Total 40.","Justify every true/false statement; an unjustified verdict earns no marks.","Pseudocode must be clear enough to be implemented directly. State all recurrences and invariants you use."],sections:[
{name:"Part A — Short answers (8 × 2 = 16)",note:"All questions compulsory.",qs:[
{q:`<b>True or False, with justification:</b> "Randomized Quicksort (uniformly random pivot) sorts every input of size n in O(n log n) time."`,marks:2,co:"CO1",ans:`<b>False.</b> The O(n log n) bound is on the <i>expected</i> running time (expectation over the algorithm's own random choices, for every fixed input). The worst case is still Θ(n²): with a tiny but non-zero probability the pivot is repeatedly the minimum or maximum, giving T(n)=T(n−1)+Θ(n). Marking: verdict (0.5), expectation vs worst case (1), mention of Θ(n²) (0.5).`},
{q:`Solve using the Master theorem / recursion tree: (a) T(n)=3T(n/2)+n²; (b) T(n)=T(n/3)+T(2n/3)+n.`,marks:2,co:"CO1",ans:`(a) a=3, b=2, n^(log₂3)=n^1.585 is polynomially smaller than f(n)=n². Case 3; regularity: 3(n/2)² = ¾n² ≤ c·n² with c=¾&lt;1 holds. So <b>T(n)=Θ(n²)</b>.<br>(b) Not Master form (unequal split). Recursion tree: every level contributes at most n (the sizes n/3 and 2n/3 add to n) and exactly n until the shallowest branch (n/3^i) ends at depth log₃n; the deepest branch ((2/3)^i·n) ends at depth log_{3/2}n. Total ≥ n·log₃n and ≤ n·log_{3/2}n, so <b>T(n)=Θ(n log n)</b>. (Confirm by substitution T(n) ≤ c n log n.)`},
{q:`Trace the merge-sort based inversion counting algorithm on A = [5, 3, 2, 4, 1] and report the number of inversions. Show how the count is accumulated in a merge step.`,marks:2,co:"CO1",ans:`Split [5,3,2,4,1] → [5,3,2] | [4,1]. [5,3,2] → [5] | [3,2]; [3,2] has 1 inversion (sorted [2,3]). Merge [5] with [2,3]: each time an element of the right list is output while the left list still holds elements, add the number of elements remaining on the left: output 2 (+1, since 5 remains), output 3 (+1) = 2. So [5,3,2] has 1+2 = 3 inversions, sorted [2,3,5]. [4,1] has 1 inversion, sorted [1,4]. Final merge [2,3,5] with [1,4]: output 1 (+3 remaining), then 2, 3 from left, output 4 (+1, since 5 remains), then 5: cross = 4. <b>Total = 3 + 1 + 4 = 8</b>. Check: (5,3),(5,2),(5,4),(5,1),(3,2),(3,1),(2,1),(4,1) = 8.`},
{q:`<b>True or False, with justification:</b> "If all edge weights of a connected graph are distinct, then for any source s the shortest-path tree rooted at s is the minimum spanning tree." Give a counterexample if false.`,marks:2,co:"CO2",ans:`<b>False.</b> Triangle a,b,c with w(ab)=2, w(bc)=4, w(ac)=5 (all distinct). The MST is {ab, bc} (weight 6) because ac is the heaviest edge on the only cycle. The shortest-path tree from a has dist(b)=2 via ab and dist(c)=min(5, 2+4=6)=5 via the direct edge ac, so SPT = {ab, ac} ≠ MST. MST minimises total weight; SPT minimises each root-to-vertex distance: different objectives.`},
{q:`Build the Huffman code for the frequencies (per 100 characters) a:5, b:9, c:12, d:13, e:16, f:45. Give the codeword lengths and the total encoded length, and compare with a fixed-length code.`,marks:2,co:"CO2",ans:`Merge the two smallest repeatedly: 5+9=14; 12+13=25; 14+16=30; 25+30=55; 45+55=100. Depths: f=1 (45); c=3, d=3 (children of the 25 node); e=3 (16, child of the 30 node); a=4, b=4 (children of 14). One valid code: f=0, c=100, d=101, a=1100, b=1101, e=111. Cost = 45·1 + (12+13+16)·3 + (5+9)·4 = 45+123+56 = <b>224 bits</b> per 100 chars (2.24 bits/char). A fixed-length code for 6 symbols needs 3 bits: 300 bits, so Huffman saves about 25%.`},
{q:`Maximum weight independent set on a path with vertex weights (in order) 3, 8, 5, 9, 2, 7. Write the recurrence, fill the table and state the optimal weight and the chosen vertices.`,marks:2,co:"CO2",ans:`OPT[0]=0, OPT[1]=w₁, OPT[i]=max(OPT[i−1], OPT[i−2]+wᵢ).<br>OPT = [0, 3, 8, 8, 17, 17, 24] (i=3: max(8, 3+5)=8; i=4: max(8, 8+9)=17; i=5: max(17, 8+2)=17; i=6: max(17, 17+7)=24).<br>Backtrack: i=6 took w₆ (24 = 17+7) → i=4 took w₄ (17 = 8+9) → i=2 took w₂ (8 &gt; 3). Chosen vertices {2,4,6}, weight 8+9+7 = <b>24</b>.`},
{q:`Longest Increasing Subsequence: for S = [5, 2, 8, 6, 3, 6, 9, 7] state the O(n²) DP recurrence, give the array L[1..8] and one LIS.`,marks:2,co:"CO2",ans:`L[i] = 1 + max{ L[j] : j &lt; i, S[j] &lt; S[i] } (1 if no such j) = length of the longest increasing subsequence ending at i.<br>L = [1, 1, 2, 2, 2, 3, 4, 4] (e.g. L[6]: S=6, smaller predecessors 5→1, 2→1, 3→2, so 3; L[7]: S=9 extends L[6]=3 → 4; L[8]: S=7 extends L[6]=3 → 4). Answer = max L = <b>4</b>, e.g. 2, 3, 6, 9 (or 2, 3, 6, 7). Time O(n²); O(n log n) is possible with the tails array + binary search.`},
{q:`<b>True or False, with justification:</b> "Subset Sum is NP-complete, yet the dynamic programming algorithm runs in O(nW). Hence P = NP."`,marks:2,co:"CO3",ans:`<b>False</b> (the inference is wrong). The input size is about n·log W bits, since W is written in binary. O(nW) is exponential in log W, i.e. <i>pseudo-polynomial</i>, not polynomial. A polynomial algorithm would need time poly(n, log W). The DP is polynomial only when W is bounded by a polynomial in n (unary encoding), which is consistent with Subset Sum being (weakly) NP-complete.`}
]},
{name:"Part B — Medium-length problems (3 × 4 = 12)",note:"All three compulsory.",qs:[
{q:`<b>Interval scheduling.</b> (a) State the greedy rule that gives a maximum-size set of mutually compatible intervals. (b) Prove its optimality using an exchange (or "greedy stays ahead") argument. (c) Show by a counterexample that "choose the interval with the earliest start time" is not optimal.`,marks:4,co:"CO2",ans:`(a) Sort by finish time; repeatedly take the interval with the earliest finish time that does not overlap the last chosen one. O(n log n).<br>(b) Let greedy pick g₁,…,g_k (sorted by finish) and an optimal solution o₁,…,o_m (sorted). <i>Claim: f(g_i) ≤ f(o_i) for i ≤ k</i>. Base: g₁ has the minimum finish time overall. Step: assume f(g_{i−1}) ≤ f(o_{i−1}) ≤ s(o_i) (compatibility in OPT), so o_i was available when greedy chose g_i; greedy takes the earliest finish among available intervals, so f(g_i) ≤ f(o_i). Now if k &lt; m, o_{k+1} starts after f(o_k) ≥ f(g_k), so it was available to greedy after g_k, contradicting that greedy stopped. Hence k ≥ m, and k = m by optimality.<br>(c) Intervals [0,10], [1,2], [3,4]: earliest-start picks [0,10] (size 1) but the optimum is {[1,2],[3,4]} (size 2).<br>Marking: rule 1, proof 2, counterexample 1.`},
{q:`<b>Rod cutting.</b> Prices p₁..p₈ = 1, 5, 8, 9, 10, 17, 17, 20. (a) Write the recurrence for r(n). (b) Fill r(0..8) bottom-up. (c) Give an optimal cut for n=8 and the time complexity.`,marks:4,co:"CO2",ans:`(a) r(0)=0; r(n) = max over 1≤i≤n of ( pᵢ + r(n−i) ).<br>(b) r(1)=1; r(2)=max(5, 1+1)=5; r(3)=max(8, 1+5, 5+1)=8; r(4)=max(9, 1+8, 5+5, 8+1)=10; r(5)=max(10, 1+10, 5+8, 8+5, 9+1)=13; r(6)=max(17, 1+13, 5+10, 8+8, 9+5, 10+1)=17; r(7)=max(17, 1+17, 5+13, 8+10, 9+8, 10+5, 17+1)=18; r(8)=max(20, 1+18, 5+17, 8+13, 9+10, 10+8, 17+5, 17+1)=22.<br>Table, n=0..8: 0, 1, 5, 8, 10, 13, 17, 18, 22.<br>(c) r(8)=22 is achieved by first piece 2 (price 5) + r(6)=17 (one piece of length 6): <b>cuts 2 + 6, revenue 22</b> (the uncut rod gives only 20). Θ(n²) time (n subproblems, O(n) each), Θ(n) space; store the best first cut to reconstruct.`},
{q:`<b>Reductions.</b> (a) Define Independent Set (IS) and Vertex Cover (VC) as decision problems. (b) Prove S is an independent set of G=(V,E) iff V∖S is a vertex cover, and hence IS ≤ₚ VC. (c) Using this, and given that IS is NP-complete, argue that VC is NP-complete.`,marks:4,co:"CO3",ans:`(a) IS: given G and k, is there S⊆V, |S|≥k, with no edge inside S? VC: given G and k, is there C⊆V, |C|≤k, touching every edge?<br>(b) (⇒) If S is independent, take any edge (u,v). Not both endpoints lie in S, so at least one lies in V∖S: V∖S covers every edge. (⇐) If C=V∖S covers all edges, no edge can have both endpoints outside C, i.e. both in S, so S is independent. Hence G has an IS of size ≥k iff G has a VC of size ≤ n−k. The map (G,k) ↦ (G, n−k) is computable in linear time: <b>IS ≤ₚ VC</b>.<br>(c) VC ∈ NP: certificate C; check |C|≤k and every edge is covered in O(m). IS ≤ₚ VC and IS is NP-hard, so VC is NP-hard by transitivity; therefore NP-complete. (Also Clique ≤ₚ IS via the complement graph.)<br>Marking: definitions 1, equivalence both directions 2, NP membership + conclusion 1.`}
]},
{name:"Part C — Problem solving (3 × 4 = 12)",note:"All three compulsory.",qs:[
{q:`<b>Design (binary search variant).</b> A sorted array of n <i>distinct</i> integers has been rotated by an unknown amount (e.g. [15, 18, 2, 3, 6, 12]). (a) Design an O(log n) algorithm to find the minimum. (b) State a loop invariant and prove correctness. (c) Trace it on the example. (d) Do duplicates break your algorithm? Explain.`,marks:4,co:"CO2",ans:`(a) <pre><code>lo = 0; hi = n-1
while lo &lt; hi:
    mid = floor((lo + hi) / 2)
    if A[mid] &gt; A[hi]: lo = mid + 1
    else:               hi = mid
return A[lo]</code></pre>
(b) <b>Invariant:</b> the minimum element lies in A[lo..hi]. True initially. If A[mid] &gt; A[hi], then A[mid..hi] is not ascending, so the rotation point (the minimum) lies strictly after mid: in [mid+1, hi]. Otherwise (distinct values: A[mid] &lt; A[hi], or mid=hi) A[mid..hi] is a sorted block, so the minimum is at or before mid: in [lo, mid]. In both cases the interval strictly shrinks (lo&lt;hi implies mid&lt;hi), so the loop terminates with lo=hi, which holds the minimum. T(n)=T(n/2)+O(1), so Θ(log n).<br>(c) lo=0,hi=5,mid=2: A[2]=2 &gt; A[5]=12? No, so hi=2. mid=1: 18 &gt; 2, so lo=2. lo=hi=2: minimum <b>2</b>.<br>(d) Yes. With A=[2,2,2,0,2] or [2,0,2,2,2], A[mid]=A[hi] gives no information about which side holds the minimum. The fix hi=hi−1 gives O(n) in the worst case, and in general no o(n) algorithm exists for this case.`},
{q:`<b>0/1 Knapsack.</b> Items (weight, value): 1:(2,3), 2:(3,4), 3:(4,5), 4:(5,6); capacity W=5. (a) Write the recurrence. (b) Fill the full table K[i][c] for i=0..4, c=0..5. (c) Recover the optimal item set. (d) Why is the O(nW) running time not "polynomial"?`,marks:4,co:"CO2",ans:`(a) K[i][c] = K[i−1][c] if wᵢ &gt; c; else max( K[i−1][c], vᵢ + K[i−1][c−wᵢ] ); K[0][·]=K[·][0]=0.<br>(b) <table><tr><th>i \ c</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>1</td><td>0</td><td>0</td><td>3</td><td>3</td><td>3</td><td>3</td></tr><tr><td>2</td><td>0</td><td>0</td><td>3</td><td>4</td><td>4</td><td>7</td></tr><tr><td>3</td><td>0</td><td>0</td><td>3</td><td>4</td><td>5</td><td>7</td></tr><tr><td>4</td><td>0</td><td>0</td><td>3</td><td>4</td><td>5</td><td>7</td></tr></table>(c) K[4][5]=7=K[3][5], so item 4 is not taken; K[3][5]=K[2][5], so item 3 is not taken; K[2][5]=7 ≠ K[1][5]=3, so item 2 is taken, c=5−3=2; K[1][2]=3 ≠ K[0][2], so item 1 is taken. Optimal set {1,2}, weight 5, value <b>7</b>.<br>(d) The table has (n+1)(W+1) cells, but W needs only log W bits, so the time is exponential in the input length: pseudo-polynomial.`},
{q:`<b>Approximation analysis.</b> APPROX-VC: while edges remain, pick any edge (u,v), add both u and v to the cover C, and delete all edges incident to u or v. (a) Show C is a vertex cover. (b) Prove |C| ≤ 2·OPT. (c) Give a family of graphs on which the ratio 2 is attained and say what this shows about the analysis. (d) Name a natural heuristic for VC that has no constant-factor guarantee.`,marks:4,co:"CO3",ans:`(a) The loop ends only when no edge is left; each deleted edge was incident to a vertex placed in C, so every edge is covered.<br>(b) Let M be the set of picked edges. They form a <i>matching</i>: after picking (u,v) all edges touching u or v are deleted, so later edges share no endpoint with it. |C| = 2|M|. Any vertex cover (in particular an optimal one) contains at least one endpoint of every edge of M, and these endpoints are distinct because M is a matching. So OPT ≥ |M| and |C| = 2|M| ≤ <b>2·OPT</b>.<br>(c) K_{n,n}: the algorithm may pick a perfect matching and output all 2n vertices, while one side (n vertices) is an optimal cover. The ratio is exactly 2, so the analysis is <b>tight</b> for this algorithm.<br>(d) Greedy "repeatedly pick a maximum-degree vertex" works well in practice, but there are adversarial bipartite instances where it is a factor Θ(log n) worse than OPT; a heuristic gives no worst-case guarantee.`}
]}
]};</script><script src="../assets/exam.js"></script></body></html>
