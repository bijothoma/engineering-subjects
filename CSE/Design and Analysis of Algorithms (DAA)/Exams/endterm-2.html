<script>window.EXAM={instructions:["Answer ALL questions. Part A: 8 × 2 = 16; Part B: 3 × 4 = 12; Part C: 3 × 4 = 12. Total 40.","Justify every true/false statement; an unjustified verdict earns no marks.","Show intermediate tables and steps; a correct final number with no working earns at most half marks."],sections:[
{name:"Part A — Short answers (8 × 2 = 16)",note:"All questions compulsory.",qs:[
{q:`Using the decision-tree model, derive a lower bound on the number of comparisons needed to sort 5 distinct elements, and state the general Ω(n log n) bound this comes from. Does the bound apply to counting sort? Why or why not?`,marks:2,co:"CO1",ans:`A comparison sort is a binary decision tree whose leaves must include every one of the n! permutations, so it has ≥ n! leaves; a binary tree of height h has ≤ 2^h leaves, so h ≥ log₂(n!) = Θ(n log n) (Stirling: log n! ≥ (n/2) log(n/2)). For n=5: 5! = 120 and 2⁶=64 &lt; 120 ≤ 128 = 2⁷, so at least <b>⌈log₂120⌉ = 7</b> comparisons are needed in the worst case. Counting sort is <i>not</i> a comparison sort (it indexes by key value), so the bound does not apply; it runs in O(n+k).`},
{q:`Compute 3¹³ mod 7 with the repeated-squaring (square-and-multiply) method. Show each step and count the multiplications, and state the number of multiplications needed for xⁿ in general.`,marks:2,co:"CO1",ans:`13 = 1101₂. Left to right: start r=3 (leading bit). Next bit 1: r = r² · 3 = 9·3 = 27 ≡ 6 (mod 7). Next bit 0: r = r² = 36 ≡ 1. Next bit 1: r = r²·3 = 1·3 = 3. So <b>3¹³ ≡ 3 (mod 7)</b> (consistent with 3⁶≡1, so 3¹³ = 3^(12+1)). Cost: 3 squarings + 2 extra multiplications = 5, versus 12 by naive repeated multiplication. In general ⌊log₂n⌋ squarings plus (number of 1-bits − 1) multiplications, i.e. Θ(log n); recurrence T(n)=T(n/2)+O(1).`},
{q:`<b>Quickselect.</b> With a uniformly random pivot, call a pivot "good" if its rank lies in [n/4, 3n/4]. Show that this gives E[T(n)] ≤ 8n for the number of comparisons (any constant is acceptable if the argument is right).`,marks:2,co:"CO1",ans:`Partitioning costs ≤ n comparisons. A pivot is good with probability 1/2. A good pivot leaves a recursive call on at most 3n/4 elements; a bad pivot leaves at most n. So E[T(n)] ≤ n + ½·E[T(3n/4)] + ½·E[T(n)]. Rearranging: ½E[T(n)] ≤ n + ½E[T(3n/4)], i.e. E[T(n)] ≤ 2n + E[T(3n/4)]. Unrolling the geometric series: E[T(n)] ≤ 2n(1 + ¾ + (¾)² + …) = 2n·4 = <b>8n = O(n)</b>. (A finer analysis gives about 3.4n.) The worst case remains Θ(n²).`},
{q:`Fractional knapsack: items (value, weight) = (30,5), (40,10), (45,15), (77,22), (90,25) and capacity 35. Find the optimal value and say precisely which item is taken fractionally.`,marks:2,co:"CO2",ans:`Value/weight ratios: 6, 4, 3, 3.5, 3.6. Sort descending: item1 (6), item2 (4), item5 (3.6), item4 (3.5), item3 (3). Take item1 fully (w=5, v=30), item2 fully (w=10, v=40), total weight 15, remaining capacity 20. Item5 has weight 25 &gt; 20, so take 20/25 = 0.8 of it: value 0.8·90 = 72. Total = 30+40+72 = <b>142</b>. The fractional item is item 5 (80% of it). Correctness: exchange argument (swapping weight from a lower-ratio item to a higher-ratio one never decreases value). The greedy rule is not optimal for the 0/1 version.`},
{q:`<b>True or False, with justification:</b> "Adding the constant 10 to every edge weight of a connected weighted graph can change which spanning trees are minimum."`,marks:2,co:"CO2",ans:`<b>False.</b> Every spanning tree has exactly n−1 edges, so its weight increases by exactly 10(n−1). The ranking of all spanning trees is unchanged; hence the set of MSTs is unchanged. (Contrast: this does <i>not</i> hold for shortest paths, where paths with more edges are penalised more, so adding a constant can change the shortest path tree.) Also, Kruskal/Prim depend only on the order of the weights, so negative weights are fine for MST.`},
{q:`DAG with edges A→B(3), A→C(2), B→D(4), C→D(1), C→E(5), D→F(2), E→F(3). Give a topological order and the longest path length from A to every vertex, then the longest path A to F.`,marks:2,co:"CO2",ans:`Topological order: A, B, C, D, E, F. Recurrence: L(v) = max over edges (u,v) of L(u)+w(u,v), L(A)=0. L(B)=3, L(C)=2, L(D)=max(3+4, 2+1)=7, L(E)=2+5=7, L(F)=max(L(D)+2, L(E)+3)=max(9,10)=<b>10</b>. Longest path A→C→E→F = 2+5+3 = 10. Time O(V+E); this works for longest paths because a DAG has no cycles (it fails in general graphs).`},
{q:`Run the O(n log n) LIS algorithm (tails array with binary search, strictly increasing) on [4, 10, 4, 3, 8, 9]. Show the tails array after each element and state what tails[k] means.`,marks:2,co:"CO2",ans:`tails[k] = smallest possible last element of an increasing subsequence of length k+1 found so far. Process: 4 → [4]; 10 → [4,10]; 4 → replaces first element ≥ 4, so [4,10]; 3 → replaces 4: [3,10]; 8 → replaces 10: [3,8]; 9 → append: [3,8,9]. LIS length = <b>3</b> (e.g. 4,8,9). Note: tails is <i>not</i> itself an LIS. Each element costs one binary search, so O(n log n).`},
{q:`<b>True or False, with justification:</b> "If A ≤ₚ B and B ∈ NP, then A ∈ NP."`,marks:2,co:"CO3",ans:`<b>True.</b> Let f be the polynomial-time reduction: x ∈ A iff f(x) ∈ B, and |f(x)| ≤ poly(|x|). Let V_B be a polynomial-time verifier for B. Verifier for A: on input x and certificate c, compute f(x) and run V_B(f(x), c). It runs in time poly(|x|) + poly(|f(x)|) = poly(|x|), and accepts for some c iff f(x) ∈ B iff x ∈ A. (The certificate for B has polynomial size in |f(x)|, hence in |x|.) Caution: the converse inference (A ∈ NP ⇒ B ∈ NP) is false in general; the direction of the reduction matters.`}
]},
{name:"Part B — Medium-length problems (3 × 4 = 12)",note:"All three compulsory.",qs:[
{q:`<b>Minimum spanning tree.</b> Graph on vertices A..F with edge weights AB=4, AC=2, BC=1, BD=5, CD=8, CE=10, DE=2, DF=6, EF=3. (a) Run Kruskal's algorithm, listing every edge considered and whether it is accepted, with the Union-Find component sets. (b) Give the MST weight. (c) State the <i>cut property</i> and prove it.`,marks:4,co:"CO2",ans:`(a) Sorted edges: BC1, AC2, DE2, EF3, AB4, BD5, DF6, CD8, CE10.<br>BC(1): {B},{C} → accept {B,C}. AC(2): accept {A,B,C}. DE(2): accept {D,E}. EF(3): accept {D,E,F}. AB(4): A and B already in the same set (cycle A-B-C) → reject. BD(5): {A,B,C} vs {D,E,F} → accept, one component. Stop (5 edges = n−1).<br>(b) MST = {BC, AC, DE, EF, BD}, weight 1+2+2+3+5 = <b>13</b>.<br>(c) <b>Cut property:</b> for any cut (S, V∖S), a minimum-weight edge e crossing the cut belongs to some MST (to every MST if e is the unique lightest). Proof: let T be an MST not containing e=(u,v). Adding e to T creates a cycle, which must cross the cut at another edge e′ ≠ e. Then T′ = T + e − e′ is a spanning tree with w(T′) = w(T) + w(e) − w(e′) ≤ w(T), so T′ is also an MST and it contains e. This is what justifies each accepted Kruskal edge (the cut separates the two components being joined); AB is rejected by the cycle property (it is the heaviest edge on cycle A-B-C).`},
{q:`<b>Matrix chain multiplication.</b> Matrices A₁ (5×10), A₂ (10×3), A₃ (3×12), A₄ (12×5), so dimensions p = (5, 10, 3, 12, 5). (a) Write the recurrence for m[i][j]. (b) Fill the m table and the split table s. (c) Give the optimal parenthesization and cost.`,marks:4,co:"CO2",ans:`(a) m[i][i]=0; m[i][j] = min over i≤k&lt;j of m[i][k] + m[k+1][j] + p_{i−1}·p_k·p_j.<br>(b) Length 2: m[1,2] = 5·10·3 = 150; m[2,3] = 10·3·12 = 360; m[3,4] = 3·12·5 = 180.<br>Length 3: m[1,3] = min( k=1: 0+360+5·10·12=600 → 960; k=2: 150+0+5·3·12=180 → 330 ) = 330 (s=2). m[2,4] = min( k=2: 0+180+10·3·5=150 → 330; k=3: 360+0+10·12·5=600 → 960 ) = 330 (s=2).<br>Length 4: m[1,4] = min( k=1: 0+330+5·10·5=250 → 580; k=2: 150+180+5·3·5=75 → 405; k=3: 330+0+5·12·5=300 → 630 ) = 405 (s=2).<br>m table (upper triangle): m11..m44 = 0; m12=150, m23=360, m34=180; m13=330, m24=330; m14=405. s: s12=1, s23=2, s34=3, s13=2, s24=2, s14=2.<br>(c) s14=2 ⇒ (A₁A₂)(A₃A₄); <b>optimal order ((A₁A₂)(A₃A₄)), 405 scalar multiplications</b>. Θ(n³) time, Θ(n²) space.`},
{q:`<b>NP-completeness reduction.</b> Reduce 3-SAT to Independent Set. (a) Describe the construction. (b) Apply it to φ = (x ∨ y ∨ z) ∧ (¬x ∨ ¬y ∨ z) ∧ (x ∨ ¬y ∨ ¬z): list the vertices, the clause edges and the conflict edges, and give k. (c) Prove φ is satisfiable iff the graph has an independent set of size k.`,marks:4,co:"CO3",ans:`(a) For each clause with literals l₁,l₂,l₃ create a triangle on three vertices labelled l₁,l₂,l₃. Add a <i>conflict edge</i> between every pair of vertices labelled with complementary literals (x and ¬x) in different triangles. Set k = number of clauses m.<br>(b) Clause triangles: C1 = {x₁, y₁, z₁}, C2 = {¬x₂, ¬y₂, z₂}, C3 = {x₃, ¬y₃, ¬z₃}; 9 vertices, 9 triangle edges. Conflict edges: x₁–¬x₂, ¬x₂–x₃, y₁–¬y₂, y₁–¬y₃, z₁–¬z₃, z₂–¬z₃ (6 edges). k = 3. Satisfying assignment x=T, y=F, z=T gives independent set {x₁, ¬y₂, x₃} (one vertex per triangle, no conflicting pair: x₁ and x₃ are the same literal and not joined).<br>(c) (⇒) Take a satisfying assignment; pick one true literal in each clause. Within a triangle only one vertex is chosen; two chosen vertices in different triangles cannot be complementary because both literals are true. So we get an independent set of size m. (⇐) An independent set of size m has at most one vertex per triangle, hence exactly one per triangle. Set the literals of the chosen vertices true; no variable is forced both true and false, because complementary vertices are adjacent. Unassigned variables are arbitrary. Each clause has a true literal. The graph has O(m) vertices and is built in polynomial time, so 3-SAT ≤ₚ IS.`}
]},
{name:"Part C — Problem solving (3 × 4 = 12)",note:"All three compulsory.",qs:[
{q:`<b>Maximum subarray (divide and conquer).</b> (a) Describe how to find the best subarray that crosses the midpoint in O(n) and give the recurrence for the whole algorithm and its solution. (b) For A = [13, −3, −25, 20, −3, −16, −23, 18, 20, −7, 12, −5, −22, 15, −4, 7] (n=16, split after position 8) compute the best crossing sum and say what the overall answer is. (c) State a linear-time alternative (Kadane) with its recurrence.`,marks:4,co:"CO2",ans:`(a) The best crossing subarray = (best sum of a suffix of the left half ending at mid) + (best sum of a prefix of the right half starting at mid+1). Scan left from mid keeping a running sum and the maximum; scan right from mid+1 likewise; add the two maxima: Θ(n). Algorithm: return the max of (left-half answer, right-half answer, crossing answer). T(n) = 2T(n/2) + Θ(n) ⇒ <b>Θ(n log n)</b> (Master case 2). Base case: a single element.<br>(b) Left half = [13,−3,−25,20,−3,−16,−23,18]; suffix sums from position 8 going left: 18, −5, −21, −24, −4, −29, −32, −19; best = <b>18</b> (just A[8]). Right half = [20,−7,12,−5,−22,15,−4,7]; prefix sums: 20, 13, 25, 20, −2, 13, 9, 16; best = <b>25</b> (A[9..11]). Crossing best = 18+25 = <b>43</b>, subarray A[8..11] = 18, 20, −7, 12. The left half alone has best 20 (A[4]) and the right half alone has 25; so the overall maximum is <b>43</b>.<br>(c) Kadane: best ending at i, e(i) = max(A[i], e(i−1)+A[i]); answer = max e(i); O(n) time and O(1) space.`},
{q:`<b>Weighted interval scheduling.</b> Intervals (start, finish, weight), sorted by finish: I1(1,4,5), I2(3,5,1), I3(0,6,8), I4(4,7,4), I5(3,9,3), I6(5,10,6), I7(8,11,3). Two intervals are compatible if one finishes no later than the other starts. (a) Compute p(j) for each j. (b) Write the recurrence and compute M[0..7]. (c) Find the optimal set and weight.`,marks:4,co:"CO2",ans:`(a) p(j) = largest index i&lt;j with finish(i) ≤ start(j) (0 if none): p(1)=0; p(2)=0 (start 3, no interval finishes by 3); p(3)=0 (start 0); p(4)=1 (start 4, I1 ends at 4); p(5)=0 (start 3); p(6)=2 (start 5: I2 ends at 5; I3 ends at 6 &gt; 5); p(7)=4 (start 8: I4 ends at 7).<br>(b) M[0]=0; M[j] = max( M[j−1], wⱼ + M[p(j)] ).<br>M[1]=max(0,5)=5; M[2]=max(5,1+0)=5; M[3]=max(5,8+0)=8; M[4]=max(8,4+M[1]=9)=9; M[5]=max(9,3+0)=9; M[6]=max(9,6+M[2]=11)=11; M[7]=max(11,3+M[4]=12)=12.<br>M = [0, 5, 5, 8, 9, 9, 11, 12].<br>(c) Trace back: M[7]=12 came from 3+M[4] ⇒ take I7, go to 4; M[4]=9=4+M[1] ⇒ take I4, go to 1; M[1]=5 ⇒ take I1, go to 0. Optimal set <b>{I1, I4, I7}</b>, weight 5+4+3 = <b>12</b>. Time O(n log n) for sorting and computing p, then O(n). Plain earliest-finish greedy ignores weights (it maximises the count, not the weight), which is why DP is needed.`},
{q:`<b>Approximation for metric TSP.</b> (a) State the algorithm that builds a tour from an MST and prove it is a 2-approximation when distances satisfy the triangle inequality. (b) Apply it to 4 cities with d(A,B)=d(B,C)=d(C,D)=1, d(A,C)=d(B,D)=2, d(A,D)=3, starting at A. (c) Why is the triangle inequality essential?`,marks:4,co:"CO3",ans:`(a) <b>Algorithm:</b> compute an MST T; do a preorder (DFS) walk of T and list vertices in the order first visited; return to the start. <b>Proof:</b> (i) Deleting one edge of an optimal tour leaves a spanning path, so w(T) ≤ w(MST) ≤ OPT. (ii) A full walk W that traverses every tree edge twice has cost 2w(T) ≤ 2·OPT. (iii) The preorder tour H is obtained from W by shortcutting repeated vertices; by the triangle inequality shortcuts never increase length, so cost(H) ≤ cost(W) = 2w(T) ≤ <b>2·OPT</b>.<br>(b) MST: AB, BC, CD (weight 3), a path. Preorder from A: A, B, C, D, back to A. Cost = 1+1+1+d(D,A)=3 → <b>6</b>. Optimal tour also costs 6 (A-B-C-D-A; A-B-D-C-A costs 1+2+1+2=6). Bound check: 2·w(T)=6 ≥ 6.<br>(c) Without the triangle inequality, shortcutting can increase the length, and in fact unless P=NP no polynomial-time algorithm can approximate general TSP within any constant factor (otherwise Hamiltonian Cycle could be decided: give weight 1 to edges, a huge weight to non-edges). Heuristics like nearest neighbour or 2-opt do well in practice but carry no such guarantee.`}
]}
]};</script><script src="../assets/exam.js"></script></body></html>
