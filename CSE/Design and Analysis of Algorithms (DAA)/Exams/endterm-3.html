<script>window.EXAM={instructions:["Answer ALL questions. Part A: 8 × 2 = 16; Part B: 3 × 4 = 12; Part C: 3 × 4 = 12. Total 40.","Justify every true/false statement; give a counterexample when you claim a statement is false.","Show all table entries and intermediate steps."],sections:[
{name:"Part A — Short answers (8 × 2 = 16)",note:"All questions compulsory.",qs:[
{q:`<b>True or False, with justification:</b> "The deterministic linear-time selection algorithm (median of medians) still runs in O(n) if the elements are split into groups of 3 instead of groups of 5."`,marks:2,co:"CO1",ans:`<b>False.</b> With groups of 3 there are n/3 group medians; the median of medians x is ≥ half of them, so at least (n/6) groups × 2 elements = n/3 elements are ≤ x (similarly ≥ x). The worst-case recursive call is on 2n/3 elements. Recurrence: T(n) ≤ T(n/3) + T(2n/3) + O(n). The two subproblem sizes add up to exactly n (1/3 + 2/3 = 1), so every level of the recursion tree costs Θ(n) and there are Θ(log n) levels: T(n)=Θ(n log n). With groups of 5 the sizes are n/5 and ≤ 7n/10 which add to 9n/10 &lt; n, giving a geometric series and O(n).`},
{q:`In the closest-pair-of-points algorithm, after the recursive calls return δ = min(δ_L, δ_R), the strip of width 2δ around the dividing line is scanned in y-order. Why does each point need to be compared with only the next constant number (at most 7) of points in the strip?`,marks:2,co:"CO1",ans:`Take a point p in the strip. Any point q that could be closer than δ to p and lies above p lies in the 2δ × δ rectangle directly above p. Divide this rectangle into 8 squares of side δ/2. Each square lies on one side of the dividing line, and two points inside the same δ/2 × δ/2 square would be at distance ≤ δ/√2 &lt; δ, contradicting that all points on the same side are at pairwise distance ≥ δ. So each square holds at most 1 point, the rectangle holds at most 8 points (including p), and p needs to be compared with at most 7 subsequent points in y-order. This makes the combine step O(n) and the total T(n) = 2T(n/2) + O(n) = O(n log n) (provided the y-sorted order is maintained by merging).`},
{q:`A student computes xⁿ with <code>pow(x,n) = pow(x, n/2) * pow(x, n/2)</code> for even n (and the analogous rule for odd n), calling the recursion twice. Write the recurrence for the number of multiplications and solve it. How should it be fixed, and what does the fix cost?`,marks:2,co:"CO1",ans:`T(n) = 2T(n/2) + 1, T(1)=0. Master theorem (a=2, b=2, f=O(1) = O(n^(1−ε))): <b>T(n)=Θ(n)</b>, no better than naive repeated multiplication (exactly n−1 multiplications). Fix: compute y = pow(x, ⌊n/2⌋) <i>once</i>, store it, return y·y (times x if n odd). Then T(n) = T(n/2) + O(1) = <b>Θ(log n)</b> multiplications. Lesson: recomputing identical subproblems destroys the benefit of divide and conquer; this is the same overlap issue that motivates dynamic programming.`},
{q:`<b>Greedy on trees.</b> Rule: repeatedly take a leaf ℓ, add it to the independent set I, and delete ℓ together with its neighbour. Run it on the tree with edges 1–2, 1–3, 2–4, 2–5, 3–6, 5–7, 5–8, 6–9 and give |I|. Argue briefly that a leaf is always in some maximum independent set.`,marks:2,co:"CO2",ans:`Leaves: 4, 7, 8, 9. Take 4 (I={4}), delete 4 and its neighbour 2. Remaining edges: 1–3, 3–6, 5–7, 5–8, 6–9. Take 7 (I={4,7}), delete 7 and 5; vertex 8 becomes isolated, so take 8 (I={4,7,8}). Take 9, delete 9 and 6 (I={4,7,8,9}). Remaining edge 1–3: take leaf 1, delete 3. <b>I = {4,7,8,9,1}, |I| = 5</b>. (Optimal: the matching {2–4, 5–7, 6–9, 1–3} has 4 edges, so any vertex cover has ≥ 4 vertices and any independent set has ≤ 9−4 = 5.) <b>Why a leaf is safe:</b> let ℓ have parent p and let S be a maximum independent set. If ℓ ∈ S we are done. Otherwise p ∈ S (else S+ℓ would be larger); then S − p + ℓ is independent (ℓ's only neighbour is p) and has the same size.`},
{q:`<b>True or False, with justification:</b> "For a given set of symbol frequencies, all Huffman trees have exactly the same multiset of codeword lengths." If false, give a counterexample.`,marks:2,co:"CO2",ans:`<b>False.</b> Ties in the priority queue allow different merges. Frequencies 1, 1, 2, 2: merge 1+1 = 2, now the queue holds 2′ (the merged node), 2a, 2b. Option 1: merge 2a+2b = 4, then 2′+4: all four symbols get length 2 (lengths {2,2,2,2}). Option 2: merge 2′+2a = 4′, then 2b+4′: lengths 2b → 1, 2a → 2, and the two 1's → 3 (lengths {1,2,3,3}). Costs: option 1 = 1·2+1·2+2·2+2·2 = 12; option 2 = 1·3+1·3+2·2+2·1 = 12. Same total (both optimal) but different length multisets.`},
{q:`Shortest paths in a DAG with a negative edge: S→A(2), S→B(3), B→A(−4), A→C(2), B→C(6), C→T(1), A→T(7). Compute the shortest distances from S using a topological order, and show what Dijkstra's algorithm would wrongly return for T.`,marks:2,co:"CO2",ans:`Topological order: S, B, A, C, T. d(S)=0; d(B)=3; d(A)=min(2, 3−4)=−1; d(C)=min(−1+2, 3+6)=1; d(T)=min(1+1, −1+7)=<b>2</b> (path S→B→A→C→T). Time O(V+E), valid with negative weights because every vertex is processed after all its predecessors. Dijkstra: pops A at distance 2 and finalises it (relaxes C=4, T=9); pops B (3) and cannot improve the already-finalised A; pops C (4) giving T = 5. It returns <b>5 ≠ 2</b>, since it relies on non-negative weights for its "finalised" invariant.`},
{q:`<b>True or False, with justification:</b> "For maximum weight independent set on a path, repeatedly choosing the heaviest remaining vertex and deleting its neighbours is optimal." Give a counterexample if false, and state the DP that does work.`,marks:2,co:"CO2",ans:`<b>False.</b> Path with weights 3, 4, 3. Greedy picks the 4 (middle) and deletes both neighbours: weight 4. The optimum is the two end vertices: 3+3 = 6. The correct DP: OPT[i] = max(OPT[i−1], OPT[i−2] + wᵢ); here OPT = 0, 3, 4, 6. The greedy-choice property fails because a locally heaviest vertex can block two vertices whose combined weight is larger.`},
{q:`<b>True or False, with justification:</b> "Vertex Cover with the parameter k fixed to the constant 10 (i.e. 'does G have a vertex cover of size at most 10?') is NP-complete unless P = NP."`,marks:2,co:"CO3",ans:`<b>False</b> (it is in P). For fixed constant k, enumerate all C(n,10) = O(n¹⁰) subsets of at most 10 vertices and check each in O(m): polynomial time (the exponent is a constant, 10). NP-completeness of VC concerns k as part of the input (k up to n), where the number of subsets is exponential. (In fact the fixed-k problem is even solvable in O(2^k · m) by the bounded search tree: pick an edge, branch on the endpoint.)`}
]},
{name:"Part B — Medium-length problems (3 × 4 = 12)",note:"All three compulsory.",qs:[
{q:`<b>Huffman coding.</b> Symbols a, b, c, d, e have probabilities 0.35, 0.10, 0.20, 0.20, 0.15. (a) Build a Huffman tree, give the codewords and the expected code length. (b) Prove the key lemma behind Huffman's correctness: if x and y are the two least-frequent symbols, then some optimal prefix tree has x and y as sibling leaves at maximum depth.`,marks:4,co:"CO2",ans:`(a) Merge b(0.10)+e(0.15) = 0.25; merge c(0.20)+d(0.20) = 0.40; merge 0.25 + a(0.35) = 0.60; merge 0.40 + 0.60 = 1. Codewords (left=0): c = 00, d = 01, a = 10, b = 110, e = 111. Expected length = 0.20·2 + 0.20·2 + 0.35·2 + 0.10·3 + 0.15·3 = 0.4+0.4+0.7+0.3+0.45 = <b>2.25 bits/symbol</b> (fixed-length would need 3).<br>(b) Let T be an optimal tree and let a, b be two sibling leaves of maximum depth (they exist because an optimal tree is full). WLOG f(x) ≤ f(y) and f(a) ≤ f(b). Since x, y are the least frequent, f(x) ≤ f(a) and f(y) ≤ f(b). Exchange x and a to get T′: cost(T′) − cost(T) = f(x)d(a) + f(a)d(x) − f(x)d(x) − f(a)d(a) = −(f(a) − f(x))(d(a) − d(x)) ≤ 0, since f(a) ≥ f(x) and d(a) ≥ d(x) (a is deepest). Then exchange y and b the same way to get T″ with cost(T″) ≤ cost(T′) ≤ cost(T). So T″ is optimal and has x, y as deepest siblings. By induction (merging x, y into one symbol of frequency f(x)+f(y)), Huffman's tree is optimal.`},
{q:`<b>Edit distance.</b> Compute the edit distance (insert, delete, substitute all cost 1) between SNOWY and SUNNY. (a) State the recurrence and base cases. (b) Fill the complete 6×6 table. (c) Read off one optimal alignment (sequence of edit operations).`,marks:4,co:"CO2",ans:`(a) D[i][0]=i, D[0][j]=j; D[i][j] = min( D[i−1][j]+1 (delete), D[i][j−1]+1 (insert), D[i−1][j−1] + [s_i ≠ t_j] ).<br>(b) Rows = SNOWY, columns = SUNNY:<table><tr><th></th><th>ε</th><th>S</th><th>U</th><th>N</th><th>N</th><th>Y</th></tr><tr><th>ε</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><th>S</th><td>1</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>N</th><td>2</td><td>1</td><td>1</td><td>1</td><td>2</td><td>3</td></tr><tr><th>O</th><td>3</td><td>2</td><td>2</td><td>2</td><td>2</td><td>3</td></tr><tr><th>W</th><td>4</td><td>3</td><td>3</td><td>3</td><td>3</td><td>3</td></tr><tr><th>Y</th><td>5</td><td>4</td><td>4</td><td>4</td><td>4</td><td>3</td></tr></table>Edit distance = D[5][5] = <b>3</b>.<br>(c) One optimal alignment: S=S (match), insert U, N=N (match), substitute O→N, delete W, Y=Y (match). Cost = 1 (insert) + 1 (substitute) + 1 (delete) = 3. In the table this is the path (0,0)→(1,1)→(1,2)→(2,3)→(3,4)→(4,4)→(5,5), whose values are 0,0,1,1,2,3,3. Any other path of total cost 3 is also acceptable. Time and space Θ(mn).`},
{q:`<b>Exact Cover ≤ₚ Subset Sum.</b> (a) Give the general construction. (b) Apply it to U = {1,2,3,4}, S₁ = {1,2}, S₂ = {3,4}, S₃ = {2,3}, S₄ = {1,4}: write each number and the target (use decimal digits). (c) Prove correctness, and say why the base must exceed the number of sets.`,marks:4,co:"CO3",ans:`(a) Exact Cover: given universe U (|U| = m) and sets S₁..S_n, choose sets that partition U. Represent each element of U by one digit position in base B = n+1. For each Sᵢ create the number aᵢ with digit 1 in the positions of its elements and 0 elsewhere. Target t = (11…1) in base B (m ones). Polynomial time: n numbers of m digits.<br>(b) Positions for elements 1,2,3,4 (left to right): a₁ = 1100, a₂ = 0011 = 11, a₃ = 0110 = 110, a₄ = 1001, target t = 1111 (in decimal digits, valid since at most 4 sets &lt; 10). Subsets summing to 1111: {a₁, a₂} = 1100+11, and {a₃, a₄} = 110+1001. These are exactly the exact covers {S₁,S₂} and {S₃,S₄}.<br>(c) (⇒) An exact cover contributes exactly one 1 to every digit, so the sum is 11…1. (⇐) The base exceeds n, so adding at most n numbers never produces a carry between digit positions; digit-wise the sum is then exact. A digit equal to 1 means exactly one chosen set contains that element, so the chosen sets partition U. (With a small base, carries could fake the target.) Subset Sum ∈ NP, so it is NP-complete given that Exact Cover is.`}
]},
{name:"Part C — Problem solving (3 × 4 = 12)",note:"All three compulsory.",qs:[
{q:`<b>Strassen's algorithm.</b> (a) Write the recurrence for Strassen's method and solve it; compare with the standard divide-and-conquer recurrence. (b) For A = [[1, 3], [7, 5]] and B = [[6, 8], [4, 2]] compute the seven products M₁..M₇ and recover AB. (c) Why must the algorithm work over a ring without needing commutativity of multiplication?`,marks:4,co:"CO1",ans:`(a) Strassen: 7 multiplications of (n/2)×(n/2) matrices plus Θ(n²) additions: T(n) = 7T(n/2) + Θ(n²). Master theorem: n^(log₂7) = n^2.807 dominates n², so <b>T(n)=Θ(n^(log₂7)) ≈ Θ(n^2.81)</b>. The standard block method uses 8 recursive products: T(n) = 8T(n/2) + Θ(n²) = Θ(n³).<br>(b) With M₁=(A₁₁+A₂₂)(B₁₁+B₂₂), M₂=(A₂₁+A₂₂)B₁₁, M₃=A₁₁(B₁₂−B₂₂), M₄=A₂₂(B₂₁−B₁₁), M₅=(A₁₁+A₁₂)B₂₂, M₆=(A₂₁−A₁₁)(B₁₁+B₁₂), M₇=(A₁₂−A₂₂)(B₂₁+B₂₂):<br>M₁ = (1+5)(6+2) = 48; M₂ = (7+5)·6 = 72; M₃ = 1·(8−2) = 6; M₄ = 5·(4−6) = −10; M₅ = (1+3)·2 = 8; M₆ = (7−1)(6+8) = 84; M₇ = (3−5)(4+2) = −12.<br>C₁₁ = M₁+M₄−M₅+M₇ = 48−10−8−12 = 18; C₁₂ = M₃+M₅ = 14; C₂₁ = M₂+M₄ = 62; C₂₂ = M₁−M₂+M₃+M₆ = 48−72+6+84 = 66.<br>AB = [[18, 14], [62, 66]]. Direct check: 1·6+3·4 = 18, 1·8+3·2 = 14, 7·6+5·4 = 62, 7·8+5·2 = 66. ✓.<br>(c) In the recursion the entries are themselves blocks (matrices) and block multiplication is not commutative, so the formulas never swap the order of factors; subtraction (a ring) is used, but not commutativity.`},
{q:`<b>Optimal binary search tree.</b> Keys k₁&lt;k₂&lt;k₃&lt;k₄ have access frequencies 4, 2, 6, 3 (no unsuccessful searches). (a) Write the recurrence for e[i][j] (expected/weighted cost, root at depth 1). (b) Fill the e table and the root table. (c) Draw the optimal tree and give its cost.`,marks:4,co:"CO2",ans:`(a) Let W(i,j) = f_i + … + f_j. e[i][i−1] = 0; e[i][j] = min over i≤r≤j of ( e[i][r−1] + e[r+1][j] ) + W(i,j). (Every key moves one level deeper than in its subtree, which adds W(i,j).)<br>(b) Length 1: e11=4, e22=2, e33=6, e44=3.<br>Length 2: e12: r=1: 0+2+6 = 8; r=2: 4+0+6 = 10 → <b>8</b>, root 1. e23 (W=8): r=2: 0+6+8 = 14; r=3: 2+0+8 = 10 → <b>10</b>, root 3. e34 (W=9): r=3: 0+3+9 = 12; r=4: 6+0+9 = 15 → <b>12</b>, root 3.<br>Length 3: e13 (W=12): r=1: 0+10+12 = 22; r=2: 4+6+12 = 22; r=3: 8+0+12 = 20 → <b>20</b>, root 3. e24 (W=11): r=2: 0+12+11 = 23; r=3: 2+3+11 = 16; r=4: 10+0+11 = 21 → <b>16</b>, root 3.<br>Length 4 (W=15): r=1: 0+16+15 = 31; r=2: 4+12+15 = 31; r=3: 8+3+15 = 26; r=4: 20+0+15 = 35 → <b>e14 = 26</b>, root 3.<br>Root table: r11=1, r22=2, r33=3, r44=4; r12=1, r23=3, r34=3; r13=3, r24=3; r14=3.<br>(c) Root k₃; left subtree on {k₁,k₂} has root k₁ with k₂ as its right child; right child of k₃ is k₄. Cost = 6·1 + 4·2 + 3·2 + 2·3 = 6+8+6+6 = <b>26</b>. Θ(n³) time (Knuth's optimisation gives Θ(n²)).`},
{q:`<b>Cook–Levin and a reduction.</b> (a) State the Cook–Levin theorem and outline the proof idea (variables and the types of clauses). Why does it make later NP-completeness proofs easier? (b) Prove Hamiltonian Cycle ≤ₚ TSP (decision version: is there a tour of total length ≤ k?).`,marks:4,co:"CO3",ans:`(a) <b>Theorem:</b> SAT is NP-complete: SAT ∈ NP, and every L ∈ NP reduces to SAT in polynomial time. <b>Proof idea:</b> L has a verifier running in time p(n); simulate its computation on a p(n) × p(n) tableau (row t = configuration at time t). Boolean variables x[i,j,s] mean "cell (i,j) holds symbol s". Clauses: (1) each cell holds exactly one symbol; (2) the first row is the start configuration encoding input x (certificate cells left free); (3) some cell in the last row shows the accepting state; (4) every 2×3 window of the tableau is a legal window according to the transition rules (this encodes correct computation locally). There are O(p(n)²) variables and clauses; the formula is satisfiable iff the verifier accepts for some certificate. <b>Consequence:</b> once one NP-complete problem exists, proving a new problem NP-complete only needs membership in NP plus one reduction from a known NP-complete problem (SAT → 3-SAT → IS → VC …), instead of reducing all of NP.<br>(b) Given G=(V,E), n=|V|, build a complete graph on V with d(u,v)=1 if (u,v)∈E and d(u,v)=2 otherwise; set k=n. (⇒) A Hamiltonian cycle uses n edges of G, so the tour has length n ≤ k. (⇐) A tour has n edges each of length ≥ 1, total ≤ n forces every edge to have length exactly 1, i.e. to be an edge of G: the tour is a Hamiltonian cycle. The construction is O(n²), and TSP ∈ NP (verify the tour and its length), so TSP is NP-complete. Since 2 ≤ 1+1, these distances satisfy the triangle inequality: even metric TSP is NP-hard, which motivates approximation algorithms.`}
]}
]};</script><script src="../assets/exam.js"></script></body></html>
