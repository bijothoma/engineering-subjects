<script>window.QUIZ={items:[
 {
  "q": "Two UDP clients on different hosts (different source IPs and source ports) both send datagrams to the same server IP address and destination port 5000. At the server, the datagrams are delivered to:",
  "opts": [
   "two different sockets, because UDP demultiplexing uses the full four-tuple",

  ],
  "ans": 2,
  "why": "UDP sockets are identified by the two-tuple (destination IP, destination port). Source information is only passed up so the application can reply. The four-tuple is TCP's demultiplexing rule, which is the tempting wrong answer; differing source IPs matter only to TCP. UDP has no per-sender state, so nothing is dropped because of a 'busy' sender."
 },
 {
  "q": "A web server listening on port 80 has three simultaneous TCP connections from the same client host, each from a different client port. How many sockets does the server process use for data transfer, and how does TCP demultiplex?",

  ],
  "ans": 0,
  "why": "The listening socket only accepts SYNs; each accepted connection gets its own connection socket identified by the 4-tuple. Destination port alone (80) is identical for all three segments, so it cannot separate them. Source IP alone is identical here too, since all three come from one host."
 },
 {
  "q": "A UDP header has a Length field containing 1000. How many bytes of application data does the datagram carry?",
  "opts": [
   "1000 bytes",
   "1008 bytes",

   "992 bytes"
  ],
  "ans": 3,
  "why": "The UDP Length field counts header plus data, and the header is 8 bytes (source port, destination port, length, checksum, 2 bytes each). Data = 1000 - 8 = 992. 1000 forgets the header; 1008 adds instead of subtracting; 984 subtracts 16 (a double header)."
 },
 {
  "q": "Compute the UDP/Internet checksum of the three 16-bit words 0110011001100000, 0101010101010101 and 1000111100001100.",
  "opts": [
   "0100101011000010",
   "1011010100111101",
   "1011010100111110",
   "0100101011000001"
  ],
  "ans": 1,
  "why": "Add: 0110011001100000 + 0101010101010101 = 1011101110110101; adding 1000111100001100 gives 1 0100101011000001, and wrapping the carry round gives 0100101011000010 (the sum). The checksum is its 1's complement, 1011010100111101. 0100101011000010 is the un-complemented sum; 0100101011000001 is the sum before wrapping the carry; 1011010100111110 is the complement of the unwrapped sum (off by one)."
 },
 {
  "q": "Which application is the best fit for UDP rather than TCP?",
  "opts": [
   "A DNS query where the whole request and reply fit in one datagram and low latency matters",
   "Transferring a large file where every byte must arrive intact and in order",
   "Online banking over HTTPS",
   "Sending e-mail with SMTP"
  ],
  "ans": 0,
  "why": "UDP has no handshake, so a single request-reply costs one RTT and needs no connection state; if a reply is lost the application simply retries. File transfer, banking and SMTP need reliable in-order delivery, which UDP does not provide (the application would have to rebuild TCP)."
 },
 {
  "q": "Which error will the Internet checksum fail to detect?",
  "opts": [
   "A single bit flipped anywhere in the segment",

   "A change in the value of the pseudo-header destination address that alters the sum",
   "Two 16-bit words in the segment being swapped with each other"
  ],
  "ans": 3,
  "why": "The checksum is a sum, which is commutative, so swapping two 16-bit words leaves the sum unchanged and the error goes unnoticed. Any single-bit flip changes the sum and is detected; a burst that changes the sum is detected; and a pseudo-header change that alters the sum is detected too. (Link-layer CRC is stronger.)"
 },
 {
  "q": "In rdt2.0 (stop-and-wait with ACK/NAK, no sequence numbers) the ACK or NAK itself can be corrupted. Why is rdt2.0 therefore broken, and what is the fix in rdt2.1?",
  "opts": [
   "The sender would never time out; add a retransmission timer",

  ],
  "ans": 2,
  "why": "On a garbled ACK/NAK the sender must retransmit to be safe, but then the receiver cannot tell a retransmission from new data, so duplicates are delivered. Alternating 0/1 sequence numbers solve it. A timer is needed for loss (rdt3.0), not for corrupted feedback; reordering does not occur on this channel model; corruption detection of data already exists via the checksum."
 },
 {
  "q": "A stop-and-wait sender uses L = 8000-bit packets on a 1 Gbps link with RTT = 30 ms. What is the sender utilisation (to two significant figures)?",

  "ans": 1,
  "why": "Transmission time D = 8000 / 10^9 = 8 µs. Utilisation = D / (RTT + D) = 0.008 ms / 30.008 ms = 0.000267, i.e. 0.027%. 0.0000080 is just D in seconds (8 µs), not a ratio; 27% is a decimal-place slip; 100% would hold only if propagation delay were zero."
 },
 {
  "q": "On the same link (L = 8000 bits, R = 1 Gbps, RTT = 30 ms) a pipelined sender is allowed 3 unacknowledged packets. What is the utilisation, and about how many packets would be needed to reach 100%?",

 },
 {
  "q": "Go-Back-N with window N = 4. The sender transmits packets 0, 1, 2, 3. Packet 1 is lost; 0, 2, 3 reach the receiver. After the timeout for packet 1, how many packets does the sender retransmit and what does the receiver do with packets 2 and 3 on first arrival?",

   "It resends only 1; the receiver delivers 2 and 3 immediately to the application"
  ],
  "ans": 0,
  "why": "GBN receivers accept only in-order packets and send a cumulative ACK for the last in-order packet (here 0). Packets 2 and 3 are out of order and are discarded. The timer expires for the oldest unacked packet (1) and the sender resends everything from 1 on. Resending only 1 and buffering is Selective Repeat. Packet 0 was ACKed, so it is not resent. Delivering 2 and 3 early would break in-order delivery."
 },
 {
  "q": "A reliable protocol uses 3-bit sequence numbers (sequence space 0..7). What is the maximum window size for Selective Repeat so that the receiver cannot confuse a new packet with an old retransmission?",

   "4",
   "3"

 },
 {
  "q": "In Selective Repeat the receiver's window is [3..6] and packet 5 arrives intact. What happens?",
  "opts": [

   "Packet 5 is delivered immediately to the application",
   "Packet 5 is buffered but no ACK is sent until 3 and 4 arrive"
  ],
  "ans": 1,
  "why": "SR ACKs every correctly received packet in the window and buffers out-of-order ones; delivery is in order, so 5 waits for 3 and 4. Discarding and repeating the last ACK is GBN behaviour; immediate delivery breaks ordering; withholding the ACK would trigger needless sender timeouts for 5."
 },
 {
  "q": "A TCP sender sends three 500-byte segments with starting sequence numbers 1000, 1500 and 2000. The receiver has received the first two (bytes 1000-1999) and the third is delayed. What ACK number does the receiver send?",
  "opts": [
   "1999",
   "1500",
   "2500",
   "2000"
  ],

 },
 {
  "q": "TCP has EstimatedRTT = 100 ms and DevRTT = 10 ms. A new sample SampleRTT = 120 ms arrives. With α = 0.125 and β = 0.25, what is the new TimeoutInterval?",
  "opts": [
   "102.5 ms",
   "140 ms",
   "152.5 ms",
   "120 ms"
  ],
  "ans": 2,
  "why": "DevRTT = 0.75 x 10 + 0.25 x |120 - 100| = 12.5 (using the OLD EstimatedRTT). EstimatedRTT = 0.875 x 100 + 0.125 x 120 = 102.5. Timeout = 102.5 + 4 x 12.5 = 152.5 ms. 102.5 is only the estimate (forgets the 4 x DevRTT safety margin); 140 uses the old estimate plus 4 x 10; 120 simply copies the sample."
 },
 {
  "q": "Continuing from EstimatedRTT = 102.5 ms and DevRTT = 12.5 ms, the next sample is 80 ms. What is TimeoutInterval (to the nearest ms)?",
  "opts": [
   "160 ms",
   "80 ms",
   "100 ms",
   "118 ms"
  ],
  "ans": 0,

 },
 {
  "q": "Why does Karn's algorithm tell TCP not to take SampleRTT measurements from retransmitted segments?",

   "SampleRTT is only defined for the SYN segment",

  "ans": 1,
  "why": "If a segment is sent twice and an ACK comes back, the sender cannot tell which transmission it answers, making the RTT sample unreliable (it could be far too small or too large). Karn's rule skips such samples (and backs off the timeout). The other options invent behaviour TCP does not have: the receiver does ACK retransmissions and SampleRTT is measured on data segments in general."
 },
 {
  "q": "Receiver gets TCP segments 1, 2, 4, 5, 6 (segment 3 is lost). Under fast retransmit, when does the sender resend segment 3, without waiting for the timer?",

  "why": "Segments 4, 5, 6 each trigger a duplicate ACK for the byte after segment 2. Three duplicate ACKs signal loss, so TCP retransmits immediately. One duplicate could just be reordering, which is why TCP waits for three. Waiting for the timer is the slow path fast retransmit avoids; segment 6 can never be cumulatively ACKed past the hole at 3."
 },
 {
  "q": "A TCP receiver has RcvBuffer = 4096 bytes, LastByteRcvd = 3000 and LastByteRead = 1800. What receive window does it advertise?",

 },
 {
  "q": "A TCP connection has a fixed window of 65535 bytes (no window scaling) and RTT = 50 ms on a very fast link. What is the maximum throughput?",

 },
 {
  "q": "TCP three-way handshake: client picks ISN = 400, server picks ISN = 900. What are the seq and ack fields of the client's third segment (the ACK)?",

  "ans": 1,
  "why": "SYN and SYN-ACK each consume one sequence number. The server's SYN-ACK has seq = 900, ack = 401. The client's ACK therefore has seq = 401 (its next byte) and ack = 901 (server ISN + 1). Using 400/900 forgets that SYN consumes a number; 401/900 forgets it for the server's SYN; 901/401 swaps the fields."

 {
  "q": "Why does the side that performs the active close in TCP stay in TIME_WAIT for about 2 MSL before fully closing?",

 {

 },
 {
  "q": "TCP Reno (slow start from cwnd = 1 MSS, ssthresh = 16 MSS, +1 MSS per RTT in congestion avoidance) experiences a timeout during the round where cwnd = 19 MSS. What are ssthresh and cwnd for the round after the timeout, and what is cwnd in the 5th round after it (counting the post-timeout round as round 1)?",

 },
 {
  "q": "TCP Reno detects loss by three duplicate ACKs while cwnd = 20 MSS. What are ssthresh and cwnd immediately after entering fast recovery?",

 },
 {

 },
 {

 },
 {
  "q": "Using the TCP throughput formula 1.22 x MSS / (RTT x √L), a connection with MSS = 1500 bytes and RTT = 100 ms should fill a 10 Gbps link. What loss rate would be required?",

 {
  "q": "A bottleneck link of R = 10 Mbps is shared by 1 TCP connection from host A and 9 connections opened in parallel by host B. Assuming ideal TCP fairness per connection, what does host B get in total?",

 {
