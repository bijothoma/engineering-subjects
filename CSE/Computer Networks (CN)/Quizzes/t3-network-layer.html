<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 3 — Network Layer</title><link rel="stylesheet" href="../assets/style.css"></head><body><main><nav class="bc" aria-label="Breadcrumb"><a href="../../../index.html">Home</a><span>›</span><a href="../index.html">Computer Networks</a><span>›</span><a href="../index.html#quizzes">Quizzes</a><span>›</span><b aria-current="page">Quiz 3 — Network Layer</b></nav><h1>Quiz 3 — Network Layer</h1><div id="app"></div></main>
<script>window.QUIZ={"items": [{"q": "Which router component runs the routing algorithms and computes the forwarding table (control plane)?", "opts": ["The switching fabric", "The input port line card, which both computes and uses the table", "The routing processor", "The output port scheduler"], "ans": 2, "why": "The routing processor runs routing protocols and installs the table. Input ports only \u003ci\u003elook up\u003c/i\u003e a local copy of it; the fabric just moves packets; the output scheduler only decides transmission order."}, {"q": "What service model does the Internet network layer provide?", "opts": ["Best effort: no guarantee of delivery, ordering, delay bound or minimum bandwidth", "Guaranteed in-order delivery of every datagram", "A guaranteed minimum bandwidth per flow", "A guaranteed upper bound on delay and jitter"], "ans": 0, "why": "IP is best effort. In-order delivery, bandwidth and delay guarantees belonged to ATM-style service models (CBR/ABR) and are not offered by IP; reliability is added by TCP at the edge."}, {"q": "An IPv4 header has IHL = 7. What is the header size?", "opts": ["7 bytes, with no options", "20 bytes, since 20 is the fixed header size", "56 bytes", "28 bytes, including 8 bytes of options"], "ans": 3, "why": "IHL counts 32-bit words, so 7 x 4 = 28 bytes; the fixed part is 20, leaving 8 bytes of options. The 7-byte choice ignores the unit; 20 is only the minimum (IHL = 5); 56 wrongly multiplies by 8 (that is the unit of the fragment offset, not IHL)."}, {"q": "A subnet uses the mask 255.255.255.192. What are its prefix length and number of usable host addresses?", "opts": ["/26 and 64 hosts", "/26 and 62 hosts", "/25 and 126 hosts", "/27 and 30 hosts"], "ans": 1, "why": "192 = 11000000 so two extra bits: /26, block size 64. Usable = 64 - 2 = 62 (network and broadcast addresses are reserved), so 64 forgets that. A /25 would need mask ending 128 and a /27 would need mask ending 224."}, {"q": "What is the network address of the host 192.168.10.77/26?", "opts": ["192.168.10.0", "192.168.10.64", "192.168.10.77", "192.168.10.65"], "ans": 1, "why": "Block size is 64, and 77 lies in the block 64-127, so the network address is .64 (broadcast .127). The address ending .0 would be the network for a /24; .77 is the host itself; .65 is the first usable host, not the network."}, {"q": "A packet at the front of an input port queue waits for a busy output port, and the packets behind it, destined for idle outputs, also wait. What is this called?", "opts": ["Count-to-infinity", "Output buffer overflow", "IP fragmentation", "Head-of-line blocking"], "ans": 3, "why": "This is HOL blocking caused by input queuing in the switch fabric. Output buffer overflow happens at the output side when many packets arrive for the same link; count-to-infinity is a distance-vector routing problem; fragmentation concerns MTU."}, {"q": "Which is the correct order of messages when a host obtains an address by DHCP?", "opts": ["Discover, Offer, Request, ACK", "Offer, Discover, ACK, Request", "Request, Offer, Discover, ACK", "Discover, Request, Offer, ACK"], "ans": 0, "why": "The client first broadcasts Discover (source 0.0.0.0), the server answers with an Offer, the client broadcasts Request to accept one offer, and the server confirms with ACK. A Request cannot precede an Offer, and an ACK is always last."}, {"q": "A NAT router (public address 138.76.29.7) translated a packet from 10.0.0.1 port 3345 to source port 5001. A reply arrives for 138.76.29.7 port 5001. What does the NAT do?", "opts": ["Drops it, because private hosts cannot receive packets", "Forwards it to 138.76.29.7 port 3345", "Looks up port 5001 in its translation table and forwards the reply to 10.0.0.1 port 3345", "Broadcasts it to every host in the private network"], "ans": 2, "why": "The NAT translation table maps public port 5001 back to 10.0.0.1:3345 and rewrites the destination. Dropping would break all return traffic; keeping the public address with the private port is not a valid rewrite; broadcasting is not how NAT works since the table identifies exactly one host."}, {"q": "Roughly how many simultaneous connections can a NAT with one public address support, based on the port-number field alone?", "opts": ["About 256", "About 4 billion (2^32)", "About 2^48", "About 65,000 (2^16)"], "ans": 3, "why": "The port field is 16 bits, so at most 2^16 = 65,536 (about 64 thousand) distinct translated ports for one public IP. 2^32 would be the number of IPv4 addresses and 2^48 the size of a MAC address, not the port space."}, {"q": "How many group addresses does the IPv4 multicast range 224.0.0.0/4 contain?", "opts": ["2^28 = 268,435,456", "2^24 = 16,777,216", "2^32 = 4,294,967,296", "2^27 = 134,217,728"], "ans": 0, "why": "A /4 prefix leaves 32 - 4 = 28 host bits, giving 2^28 addresses. 2^32 is the whole IPv4 space; 2^24 would be a /8 block; 2^27 is a /5 block."}, {"q": "A 4000-byte IPv4 datagram (20-byte header) must cross a link with MTU 1500. Which describes the fragmentation correctly?", "opts": ["3 fragments; the last has total length 1040 and fragment offset 2960", "3 fragments; the last has total length 1020 and fragment offset 370", "3 fragments; the last has total length 1040 and fragment offset 370", "4 fragments; the last has total length 520 and fragment offset 555"], "ans": 2, "why": "Data = 3980 bytes; each fragment carries at most 1480 data bytes (multiple of 8), so 1480 + 1480 + 1020. The last fragment is 1020 + 20 header = 1040 bytes, starting at byte 2960, so offset = 2960/8 = 370. The option with offset 2960 uses bytes instead of 8-byte units, and the one with length 1020 forgets the header. Four fragments would only result from a miscount of the header and data sizes."}, {"q": "A router has these entries: 10.0.0.0/8 to A, 10.1.0.0/16 to B, 10.1.2.0/24 to C, 10.1.2.64/26 to D, default to E. Where is a packet for 10.1.2.77 sent?", "opts": ["C", "D", "B", "A"], "ans": 1, "why": "Matching entries are /8, /16, /24 and /26 (77 lies in 64-127). Longest-prefix match picks the /26, port D. C is only the longest match for addresses outside 64-127, such as .200; B and A are shorter matches; E would apply only if nothing else matched."}, {"q": "Using the same table (10.0.0.0/8 to A, 10.1.0.0/16 to B, 10.1.2.0/24 to C, 10.1.2.64/26 to D, default to E), which assignment gives the output port for destinations 10.1.9.9, 10.1.2.200 and 11.0.0.1 in that order?", "opts": ["B, C, E", "A, C, E", "B, D, A", "B, C, A"], "ans": 0, "why": "10.1.9.9 matches /8 and /16, so B. 10.1.2.200 matches /24 but is outside 64-127, so C. 11.0.0.1 is not inside 10/8 or any other specific prefix, so only the default route E applies, not A."}, {"q": "A bus-based router has 8 input ports at 1 Gbps each. What minimum bus rate avoids queuing at the inputs?", "opts": ["1 Gbps", "4 Gbps", "64 Gbps", "8 Gbps"], "ans": 3, "why": "All inputs may receive at the same time and the bus carries one packet at a time, so its rate must be at least N x line rate = 8 Gbps. 1 or 4 Gbps would force input queuing; 64 would be unnecessary (N squared). A crossbar relaxes this by transferring several packets in parallel."}, {"q": "The block 172.16.0.0/16 is divided using the mask 255.255.252.0. How many subnets and how many usable hosts per subnet result?", "opts": ["62 subnets with 1022 hosts each", "64 subnets with 1024 hosts each", "64 subnets with 1022 hosts each", "256 subnets with 254 hosts each"], "ans": 2, "why": "The mask is /22, so 22 - 16 = 6 borrowed bits gives 2^6 = 64 subnets, and 32 - 22 = 10 host bits give 2^10 - 2 = 1022 usable hosts. 62 applies the old 'minus two' rule to subnets; 1024 forgets reserved addresses; 256 and 254 correspond to a /24."}, {"q": "What is the broadcast address of the subnet containing 130.50.15.6/20?", "opts": ["130.50.255.255", "130.50.15.255", "130.50.0.255", "130.50.31.255"], "ans": 1, "why": "A /20 keeps the top 4 bits of the third octet; 15 = 00001111, so the network is 130.50.0.0 and the host bits fill the low 4 bits of octet 3 and all of octet 4: broadcast 130.50.15.255. The class-B broadcast .255.255 ignores the mask; .31.255 would belong to 130.50.16.0/20; .0.255 sets only the last octet."}, {"q": "For 192.168.1.0/24, LANs need 100, 50 and 25 hosts. Which VLSM allocation is valid (no overlap, large enough)?", "opts": ["192.168.1.0/26, 192.168.1.64/26, 192.168.1.128/27", "192.168.1.0/25, 192.168.1.64/26, 192.168.1.128/27", "192.168.1.0/25, 192.168.1.128/27, 192.168.1.192/26", "192.168.1.0/25, 192.168.1.128/26, 192.168.1.192/27"], "ans": 3, "why": "100 hosts need a /25 (126), 50 need a /26 (62), 25 need a /27 (30), each block aligned: .0/25, .128/26, .192/27 fits exactly. In the first alternative a /26 holds only 62 hosts, too small for 100. In the second, the /26 at .64 overlaps the /25 (addresses 0-127). In the third, the /27 at .128 holds only 30 hosts, too small for the 50-host LAN."}, {"q": "Which single prefix is the smallest that covers the networks 172.16.4.0/24, 172.16.5.0/24 and 172.16.6.0/24?", "opts": ["172.16.4.0/22", "172.16.4.0/23", "172.16.0.0/21", "172.16.6.0/22"], "ans": 0, "why": "The /22 block 172.16.4.0 spans 4.0 to 7.255, covering all three (and 7.0/24 as well). A /23 starting at 4.0 covers only 4 and 5. The /21 at 172.16.0.0 covers them but is larger than needed. 172.16.6.0/22 is not a valid network address, since a /22 must start on a multiple of 4 in the third octet."}, {"q": "Link costs are u-v 2, u-x 1, u-w 5, v-x 2, v-w 3, x-w 3, x-y 1, w-y 1, w-z 5, y-z 2. Dijkstra from u gives which least cost and path to z?", "opts": ["8, via u-x-y-w-z", "9, via u-x-w-z", "4, via u-x-y-z", "10, via u-w-z"], "ans": 2, "why": "Dijkstra finalises x (1), then v and y (2), then w (3 via y), then z (4 = D(y) + 2). Path u-x-y-z costs 1+1+2 = 4. The others are valid but costlier paths (8, 9 and 10); using the direct u-w link (5) is also worse than reaching w via y (3)."}, {"q": "Dijkstra's algorithm on a graph with n nodes, finding the minimum tentative distance by linear scan each iteration, has what complexity?", "opts": ["O(n log n), because each node is scanned once", "O(n^2), about n(n+1)/2 comparisons overall", "O(n^3), because each node updates every other node", "O(2^n), because it enumerates all paths"], "ans": 1, "why": "The scans cover n, n-1, ..., 1 nodes, giving n(n+1)/2 = O(n^2). With a binary heap it improves to O(E log n), but n log n is not achievable by scanning. Updates only touch neighbours, so it is not cubic, and Dijkstra never enumerates paths."}, {"q": "Node x has neighbours y (link cost 2), z (7) and v (3). They advertise distances to w of 4, 1 and 5. What is Dx(w) and the next hop?", "opts": ["6 via y", "8 via z", "8 via v", "4 via y"], "ans": 0, "why": "Bellman-Ford: min(2+4, 7+1, 3+5) = min(6, 8, 8) = 6 through y. z gives 8 even though its advertised distance 1 is the smallest, because the link cost 7 must be added; v also gives 8; 4 is just y's advertised distance with the link cost left out."}, {"q": "Edges: A-B 4, A-C 1, C-B 2, B-D 1, C-D 5. Running synchronous Bellman-Ford from A, after how many rounds does D first have its final value?", "opts": ["1 round", "2 rounds", "3 rounds", "4 rounds"], "ans": 2, "why": "Round 1: B=4, C=1. Round 2: B=3 (via C), D=5 (via B or C, using last round's values). Round 3: D = 3 + 1 = 4 along A-C-B-D, which has 3 edges. After round k values are correct for shortest paths with at most k edges, so two rounds leave D at 5, and a fourth round changes nothing."}, {"q": "In a distance-vector network, z routes to x via y. Poisoned reverse makes z tell y that its distance to x is infinity. What does this achieve, and what is its limit?", "opts": ["It prevents every loop of any length", "It makes link-cost increases propagate faster than decreases", "It removes the need for periodic advertisements", "It prevents two-node routing loops, but not loops involving three or more nodes"], "ans": 3, "why": "Poisoned reverse stops y from choosing a route to x that goes through z (which itself goes through y), so a bounce between two neighbours is avoided. Cycles among three or more nodes can still count to infinity, so it is not a full cure. It does not change propagation speed or the update schedule."}, {"q": "Which pairing of routing protocol and transport is correct?", "opts": ["OSPF runs over TCP; BGP runs over UDP", "OSPF runs directly over IP; BGP runs over TCP", "RIP runs over TCP; BGP runs directly over IP", "OSPF runs over UDP; RIP runs directly over IP"], "ans": 1, "why": "OSPF messages ride in IP datagrams (protocol 89) and BGP peers use TCP port 179 for reliability. RIP uses UDP (port 520). The other pairings swap these; for example BGP needs the reliable delivery of TCP and OSPF has its own reliability mechanisms over IP."}, {"q": "A BGP router learns two routes to a prefix: R1 with LOCAL-PREF 100 and AS-PATH length 2, R2 with LOCAL-PREF 200 and AS-PATH length 5. Which is selected and why?", "opts": ["R1, because it has the shorter AS-PATH", "R1, because hot-potato routing prefers the nearest exit", "R2, because the highest LOCAL-PREF (policy) is considered first", "R2, because a longer AS-PATH is preferred as more stable"], "ans": 2, "why": "BGP selection order: LOCAL-PREF first, then shortest AS-PATH, then closest NEXT-HOP (hot potato), then tie-breakers. AS-PATH length matters only when local preferences are equal; hot-potato is the third rule; longer paths are never preferred for stability."}, {"q": "A router has RTT = 250 ms and a 10 Gbps link carrying N = 10,000 long-lived flows. Using the buffer rule B = RTT x C / sqrt(N), what buffer size is suggested?", "opts": ["25 Mbit", "2.5 Gbit", "250 Mbit", "250 kbit"], "ans": 0, "why": "RTT x C = 0.25 s x 10 Gbps = 2.5 Gbit (the classic rule, appropriate for one flow). Dividing by sqrt(10,000) = 100 gives 25 Mbit. 250 Mbit divides by only 10 and 250 kbit divides by N itself rather than its square root."}, {"q": "Which is a valid shorter form of the IPv6 address 2001:0db8:0000:0000:0000:ff00:0042:8329?", "opts": ["2001:db8::ff::42:8329", "2001:db8::ff:42:8329", "2001:db8:::ff00:42:8329", "2001:db8::ff00:42:8329"], "ans": 3, "why": "Leading zeros in a group can be dropped and one run of zero groups replaced by '::'. The correct form uses '::' once. Using it twice is ambiguous, ff00 cannot lose its trailing zeros (that would change the value to 00ff), and three colons are not valid syntax."}, {"q": "Two IPv6 routers are separated by an IPv4-only region. Which transition technique carries the traffic across, and how?", "opts": ["Fragmentation: the IPv6 datagram is split into IPv4 headers by every intermediate router", "Tunneling: the IPv6 datagram is carried as the payload of an IPv4 datagram between the two routers", "NAT: IPv6 addresses are rewritten into private IPv4 addresses at every hop", "Flag day: all routers are upgraded simultaneously"], "ans": 1, "why": "In tunneling, the entry router encapsulates the IPv6 datagram in IPv4 (protocol 41) and the exit router decapsulates it. Fragmentation is not a conversion mechanism and IPv6 routers do not fragment, a NAT does not map 128-bit addresses this way, and a flag day was judged impractical for the Internet."}, {"q": "Which statement about SDN is correct?", "opts": ["OpenFlow entries match header fields from several layers and apply actions such as forward, drop, modify or send to controller, while P4 lets the programmer define how packets are parsed and processed in the data plane", "P4 is the protocol the controller uses to install flow entries in switches, whereas OpenFlow defines the packet parser", "OpenFlow can match only on the destination IP address", "In SDN each router computes its own table independently with no controller"], "ans": 0, "why": "Generalised match-plus-action is the OpenFlow abstraction, and P4 programs the data-plane pipeline itself (protocol independent). The roles in the second statement are reversed: OpenFlow is the southbound protocol. OpenFlow matches on many fields, and the defining SDN idea is a logically centralised controller, not independent per-router computation."}, {"q": "A router running reverse path forwarding (RPF) receives a multicast datagram from source S on interface i. When does it forward it onto its other interfaces?", "opts": ["Always, since multicast must reach every receiver", "Only if interface i is on the shortest path to the nearest group member", "Only if interface i is on the router's shortest path back to S", "Only if the TTL is greater than the number of group members"], "ans": 2, "why": "RPF forwards only when the packet arrives on the interface the router itself would use to reach S, so duplicate copies arriving over other paths are dropped, preventing loops. Always forwarding would flood and loop; the check is about the path to the source, not to members; TTL has no relation to the group size. Pruning then removes branches with no members."}]};</script><script src="../assets/quiz.js"></script></body></html>
