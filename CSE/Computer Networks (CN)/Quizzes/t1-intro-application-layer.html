<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 1 — Introduction &amp; Application Layer</title><link rel="stylesheet" href="../assets/style.css"></head><body><main><nav class="bc" aria-label="Breadcrumb"><a href="../../../index.html">Home</a><span>›</span><a href="../index.html">Computer Networks</a><span>›</span><a href="../index.html#quizzes">Quizzes</a><span>›</span><b aria-current="page">Quiz 1 — Introduction &amp; Application Layer</b></nav><h1>Quiz 1 — Introduction &amp; Application Layer</h1><div id="app"></div></main>
<script>window.QUIZ={items:[{"q":"Which statement best describes the Internet's \u003ci>network edge\u003c/i>?","opts":["The mesh of interconnected packet switches and links that forwards data between networks","Hosts (clients and servers) and the access networks that attach them to the first router","Only the backbone links owned by Tier-1 ISPs","The set of application-layer protocols such as HTTP and DNS"],"ans":1,"why":"The edge is made of end systems (hosts) plus the access networks (DSL, cable, Ethernet, WiFi, cellular) that connect them. The mesh of routers and links is the network core, and Tier-1 backbones are part of the core, so those options describe the wrong part. HTTP and DNS are software running on the edge, not the edge itself."},{"q":"A packet of 1500 bytes is sent on a 10 Mbps link. What is the transmission delay?","opts":["0.12 ms","12 ms","150 ms","1.2 ms"],"ans":3,"why":"d_trans = L/R = (1500 x 8 bits)/(10 x 10^6 bps) = 12000/10^7 s = 1.2 ms. 0.12 ms is off by a factor of 10, 12 ms results from using 1 Mbps, and 150 ms treats 1500 as the delay in a different unit. Transmission delay does not depend on link length."},{"q":"Why can packet switching with statistical multiplexing support more users than circuit switching on the same link?","opts":["Capacity is allocated on demand, so idle users consume none of it","Each packet is guaranteed a dedicated slice of bandwidth for the call duration","Packet switching removes queueing delay completely","Packets always follow one reserved path, which avoids retransmissions"],"ans":0,"why":"Packet switching shares capacity on demand; since users are active only part of the time, aggregate demand rarely exceeds the link rate. Reserved slices and a fixed path describe circuit switching, which wastes capacity during silence. Packet switching does not remove queueing; it introduces it, and loss occurs when buffers overflow."},{"q":"Which of the four components of nodal delay is the one that typically varies from packet to packet on the same path?","opts":["Processing delay","Transmission delay","Queueing delay","Propagation delay"],"ans":2,"why":"Queueing delay depends on how many packets are waiting ahead, so it varies. Transmission delay (L/R) is fixed for a given packet size and link rate, propagation delay (distance/speed) is fixed by the medium, and processing delay is usually microseconds and roughly constant."},{"q":"Which of the following correctly lists the five Internet protocol-stack layers from top to bottom?","opts":["Application, presentation, session, transport, network","Application, transport, network, link, physical","Application, network, transport, link, physical","Transport, application, network, physical, link"],"ans":1,"why":"The Internet (TCP/IP) five-layer stack is application, transport, network, link, physical. Presentation and session belong to the 7-layer OSI model and are folded into the application layer here. Swapping network and transport, or moving transport above application, breaks the encapsulation order."},{"q":"Why is the Internet called an \u003ci>end-to-end\u003c/i> design with respect to reliability?","opts":["Reliability and other complex functions are implemented in the end hosts, keeping the core simple and best-effort","Every router verifies and retransmits each packet hop by hop","The network core guarantees delivery using admission control","Only the applications at the edge use the physical layer"],"ans":0,"why":"The core provides best-effort forwarding; hosts add reliability (TCP) and application logic. Hop-by-hop retransmission and guaranteed delivery describe other architectures and contradict best-effort IP. The last option is false: every layer is present on hosts, and routers use the lower layers."},{"q":"A browser sends a conditional GET with the header \u003ccode>If-Modified-Since\u003c/code> and the object on the origin server has not changed. What does the server return?","opts":["200 OK with the full object","404 Not Found","301 Moved Permanently","304 Not Modified with an empty body"],"ans":3,"why":"The conditional GET lets a cache validate its copy: an unchanged object gives 304 Not Modified without the body, saving bandwidth. 200 with the body would waste the transfer, 404 means the object does not exist, and 301 means it has permanently moved."},{"q":"Which DNS record type maps an alias name to its canonical hostname?","opts":["MX","NS","CNAME","A"],"ans":2,"why":"CNAME maps an alias to the canonical name. A maps a name to an IPv4 address, NS gives the authoritative name server for a zone, and MX gives the mail server for a domain."},{"q":"How do cookies let a stateless HTTP server recognise a returning user?","opts":["The browser encrypts the user's IP address into every packet","The server sends a Set-Cookie header with an identifier; the browser returns it in the Cookie header on later requests","The server keeps one TCP connection open for months","The server stores the browser's MAC address and matches it"],"ans":1,"why":"Set-Cookie (in the response) and Cookie (in later requests) carry a server-chosen identifier, with the server keeping the state in a back-end database. IP and MAC addresses are not reliably visible across routers, and a TCP connection cannot persist for months across sessions."},{"q":"Which pair of roles is correct for e-mail protocols?","opts":["SMTP retrieves mail from the mailbox; POP3 pushes mail between servers","IMAP is used only between mail servers; SMTP only between user and server","POP3 keeps all mail permanently on the server by design and supports server-side folders","SMTP pushes mail from a user agent or server to a server; IMAP lets a user agent retrieve and manage mail kept on the server"],"ans":3,"why":"SMTP is a push protocol for sending (user agent to server and server to server); POP3 and IMAP are retrieval protocols, with IMAP keeping mail and folders on the server. The other options swap these roles; POP3 typically downloads and then deletes mail and has no server-side folders."},{"q":"Which sequence of SMTP commands correctly sends a message?","opts":["HELO, MAIL FROM, RCPT TO, DATA (body ended by a line with a single period), QUIT","MAIL FROM, HELO, DATA, RCPT TO, QUIT","DATA, HELO, RCPT TO, MAIL FROM, QUIT","HELO, RCPT TO, DATA, MAIL FROM, QUIT"],"ans":0,"why":"The dialogue greets the server, names the sender, names the recipient(s), sends the body with DATA terminated by a line containing only a period, then closes with QUIT. The other orders place the envelope commands out of sequence, which a server rejects."},{"q":"A UDP client sends a datagram using \u003ccode>sendto()\u003c/code> and the server uses \u003ccode>recvfrom()\u003c/code>. Which statement is true?","opts":["A three-way handshake happens before the first datagram","The server needs accept() to create a new socket per client","No connection is set up; each datagram carries the destination address and port, and may be lost or reordered","Data is delivered as a reliable, in-order byte stream"],"ans":2,"why":"UDP sockets are connectionless: the destination is supplied with every datagram and there is no delivery guarantee. The handshake, accept() and the reliable byte stream are TCP features."},{"q":"A link is 2500 km long and signals propagate at 2.5 x 10^8 m/s. A packet of 1000 bytes is sent at 1 Mbps. How long from the start of transmission until the last bit reaches the receiver (no queueing or processing)?","opts":["8 ms","18 ms","10 ms","10.008 ms"],"ans":1,"why":"d_trans = 8000/10^6 = 8 ms. d_prop = 2.5 x 10^6 m / 2.5 x 10^8 m/s = 10 ms. The last bit arrives at 8 + 10 = 18 ms. 8 ms and 10 ms each count only one of the two terms, and 10.008 ms comes from wrongly taking the transmission term as 0.008 ms."},{"q":"In a DASH video system, what decides which bitrate version of each chunk is requested?","opts":["The server alone, which pushes the best chunk","Routers along the path, by marking packets","The DNS server at connection set-up","The client, based on its measured throughput and playout buffer level, using the manifest file"],"ans":3,"why":"In Dynamic Adaptive Streaming over HTTP the client reads the manifest and requests each chunk at a bitrate it can sustain. The server is a plain HTTP server, routers do not choose the bitrate, and DNS only maps the name to a server."},{"q":"What is the main difference between iterative and recursive DNS queries?","opts":["With recursion the contacted server resolves the name on the client's behalf; with iteration it only returns a referral to the next server","Iterative queries use TCP and recursive queries use UDP","Recursive queries are used only between root and TLD servers","Iterative queries never return an IP address"],"ans":0,"why":"A recursive query puts the burden of resolution on the contacted server; an iterative query returns the address of the next server to ask. Both normally use UDP port 53 (TCP for large responses), recursion is typically used from host to local resolver, and an iterative query can still return an A record when the server is authoritative."},{"q":"The name \u003ccode>www.nitc.ac.in\u003c/code> is resolved by a local resolver with an empty cache using iterative queries. In what order are the servers contacted?","opts":["Authoritative server, then TLD server, then root server","TLD server, then root server, then authoritative server","Root server, then TLD (.in) server, then the authoritative server","Root server only, which answers directly"],"ans":2,"why":"Resolution walks down the delegation chain: the root returns the TLD server, the TLD returns the next-level or authoritative server, which gives the IP address. The reverse orders do not match delegation, and a root server does not store host records. Caching of NS records shortens this sequence in practice."},{"q":"In TCP socket programming, a server calls \u003ccode>listen()\u003c/code> and then \u003ccode>accept()\u003c/code>. What does accept() return?","opts":["The same welcoming socket, now connected to the client","Only the client's IP address","Nothing; data is read directly from the listening socket","A new connection socket dedicated to that client"],"ans":3,"why":"The welcoming socket stays open for new requests, and accept() returns a new socket for the connection with that client, so many clients can be served. Reusing the listening socket would block other clients, and accept() returns a socket (with the peer address), not just an IP."},{"q":"In BitTorrent, what does the \u003ci>rarest first\u003c/i> policy do, and why?","opts":["Sends chunks only to the peers with the highest download speed","Requests the chunks that fewest neighbours hold, to equalise chunk availability across the swarm","Requests chunks in file order so that streaming is possible","Gives the tracker custody of the rarest chunks"],"ans":1,"why":"Rarest first picks missing chunks with the fewest copies among neighbours, so scarce chunks are replicated quickly and are not lost. Sending to the fastest peers is the tit-for-tat choking policy, sequential order is a streaming policy that harms availability, and trackers only track peers rather than hold chunks."},{"q":"A 1 Mbps link is shared; each user needs 100 kbps while active and is active 10% of the time. With 35 users on packet switching (circuit switching would fit only 10), what is the probability that more than 10 are active simultaneously (binomial, n = 35, p = 0.1)?","opts":["About 0.04% (roughly 4 in 10,000)","About 10%","About 35%","Exactly 0, because the mean 3.5 is below 10"],"ans":0,"why":"P(X &gt; 10) = sum over k = 11..35 of C(35,k)(0.1)^k(0.9)^(35-k) = 0.000424, about 0.04%. The mean number active is 3.5, but the tail probability is small and not exactly 0; 10% and 35% confuse p or n with the tail probability."},{"q":"With traffic intensity La/R (a = packet arrival rate, L = packet size, R = link rate), what happens to the average queueing delay as La/R approaches 1 from below?","opts":["It stays constant","It falls to zero because the link is fully used","It grows very rapidly and diverges at 1","Packets are lost immediately even with an infinite buffer"],"ans":2,"why":"Queueing delay is small for La/R near 0, grows rapidly near 1, and becomes unbounded once La/R exceeds 1 (arrivals outpace service). It neither stays flat nor falls. With an infinite buffer nothing is lost; loss arises because real buffers are finite."},{"q":"A packet of 8000 bits is sent over 3 links in series (two routers in between), each of rate 2 Mbps. Ignoring propagation and queueing, how long until the whole packet arrives at the destination under store-and-forward?","opts":["4 ms","12 ms","8 ms","24 ms"],"ans":1,"why":"Each router retransmits the packet only after receiving it entirely, so per-hop delay is 8000/(2 x 10^6) = 4 ms and 3 links give 3 x 4 = 12 ms. 4 ms counts a single link, 8 ms forgets one link, and 24 ms double counts each hop."},{"q":"A page has one base HTML file and 5 small embedded objects on the same server. RTT = 50 ms and transmission times are negligible. How long does non-persistent HTTP take, fetching one object at a time with no parallel connections?","opts":["350 ms","300 ms","150 ms","600 ms"],"ans":3,"why":"Each object needs 1 RTT to set up TCP and 1 RTT for request and response = 2 RTT = 100 ms; 6 objects give 600 ms. 350 ms is persistent HTTP without pipelining, 300 ms counts only one RTT per object, and 150 ms is persistent HTTP with pipelining."},{"q":"A page has one base HTML file and 5 small embedded objects on the same server. RTT = 50 ms and transmission times are negligible. How long does persistent HTTP \u003ci>with pipelining\u003c/i> take?","opts":["150 ms","350 ms","600 ms","100 ms"],"ans":0,"why":"TCP set-up plus the base file take 2 RTT = 100 ms; once the references are known all 5 objects are requested back to back and arrive in about 1 more RTT = 50 ms, so 150 ms in total. Persistent without pipelining would need 100 + 5 x 50 = 350 ms, non-persistent 600 ms, and 100 ms covers only the base file."},{"q":"A web cache has a 40% hit rate. A hit is served in 10 ms and a miss (fetch from the origin) takes 200 ms. What is the expected delay?","opts":["80 ms","104 ms","124 ms","210 ms"],"ans":2,"why":"E = 0.4 x 10 + 0.6 x 200 = 4 + 120 = 124 ms. 80 ms is 0.4 x 200 (the weights swapped), 104 ms uses incorrect weights, and 210 ms simply adds the two delays."},{"q":"An institution's access link is 2 Mbps. Requests average 15 per second for objects of 100,000 bits each. What is the access-link traffic intensity without a cache, and with a cache that has a 40% hit rate?","opts":["0.75 both with and without a cache","1.5 without a cache and 0.9 with the cache","0.45 without a cache and 0.75 with the cache","0.75 without a cache and 0.45 with the cache"],"ans":3,"why":"Without a cache: 15 x 100,000 = 1.5 Mbps over 2 Mbps = 0.75. With a 40% hit rate only 60% of requests cross the link: 0.6 x 1.5 = 0.9 Mbps, intensity 0.45. A cache does reduce load, so equal values are wrong; 1.5 and 0.9 are rates in Mbps, not intensities; reversing the values makes the cache increase load."},{"q":"A message of 7.5 Mbit is sent over 2 store-and-forward links in series, each 1.5 Mbps (ignore propagation). Compare sending it as one packet with splitting it into 5000 packets of 1500 bits each.","opts":["10 s unsegmented versus about 5.001 s segmented","5 s unsegmented versus 10 s segmented","10 s for both, because the link rate is the same","15 s unsegmented versus 5 s segmented"],"ans":0,"why":"Unsegmented: 7.5/1.5 = 5 s per link, 10 s in total. Segmented: each packet takes 1500/(1.5 x 10^6) = 1 ms per link, and the second link works in parallel with the first, giving (5000 + 1) x 1 ms = 5.001 s. Segmentation roughly halves the delay; equal values ignore pipelining, and the other figures do not follow from the formulas."},{"q":"A file of F = 10 Gbit goes to N = 10 peers. Server upload u_s = 30 Mbps, each peer uploads at u = 2 Mbps, and the slowest peer downloads at d_min = 10 Mbps. What is the minimum distribution time in the client-server architecture?","opts":["About 1000 s","About 3333 s","About 2000 s","About 333 s"],"ans":1,"why":"D_cs = max(N F/u_s, F/d_min) = max(10 x 10^10/(30 x 10^6), 10^10/(10 x 10^6)) = max(3333.3 s, 1000 s) = 3333 s. 1000 s is only the client-side bound, 2000 s is the P2P figure for these numbers, and 333 s is F/u_s (one copy only)."},{"q":"A file of F = 10 Gbit goes to N = 10 peers. Server upload u_s = 30 Mbps, each peer uploads at u = 2 Mbps, and the slowest peer downloads at d_min = 10 Mbps. What is the minimum distribution time in a P2P architecture?","opts":["3333 s","1000 s","2000 s","100 s"],"ans":2,"why":"D_p2p = max(F/u_s, F/d_min, N F/(u_s + sum of u_i)) = max(333.3, 1000, 10 x 10^10/(30 x 10^6 + 20 x 10^6)) = max(333.3, 1000, 2000) = 2000 s; the swarm's total upload capacity is the bottleneck. 3333 s is the client-server result, 1000 s ignores the total upload term, and 100 s is not any of the terms."},{"q":"A DHT uses 4-bit identifiers and the peers have IDs 1, 3, 4, 5, 8, 10, 12, 14. The rule is that a key is stored at its closest successor (the first peer with ID greater than or equal to the key, wrapping around). Where is key 15 stored, and where is key 13 stored?","opts":["Key 15 at peer 1 (wrap-around) and key 13 at peer 14","Key 15 at peer 14 and key 13 at peer 12","Key 15 at peer 1 and key 13 at peer 12","Key 15 at peer 14 and key 13 at peer 1"],"ans":0,"why":"No peer has ID 15 or more, so key 15 wraps around to the smallest ID, peer 1. For key 13 the first ID greater than or equal to 13 is 14. Peer 12 and peer 14 are the predecessor and successor of 13; choosing the predecessor, or sending 15 to peer 14 without wrapping, violates the successor rule."},{"q":"A CDN wants each client to fetch content from a nearby cluster. Which mechanism is most commonly used to direct the client?","opts":["The client broadcasts a request to all servers worldwide","The origin server tunnels packets to the client","Each client edits its own BGP routes","The CDN's authoritative DNS server returns the IP address of a suitable cluster chosen from the resolver's location and load"],"ans":3,"why":"CDNs commonly use DNS redirection: the CDN's name server answers with the address of a cluster chosen from the resolver's location and server load. Clients cannot broadcast across the Internet, origin servers do not tunnel for CDNs, and clients do not control BGP routes."}]};</script><script src="../assets/quiz.js"></script></body></html>
