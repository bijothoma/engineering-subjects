<script>window.EXAM={instructions:["Answer ALL questions. The paper totals 40 marks (Unit 1: 8, Unit 2: 12, Unit 3: 12, Unit 4: 8).","Show all working and state assumptions. Take 1 Mbps = 10^6 bit/s and c = 2x10^8 m/s in cables.","Model answers include full working; attempt before viewing."],
sections:[
{name:"Unit 1 — Introduction and Application Layer (8 marks)",note:"Q1 (3) + Q2 (3) + Q3 (2). All compulsory.",qs:[
{q:`<p>(a) Ten packets of 1250 bytes arrive simultaneously at an empty router output queue served by a 10 Mbps link. Find the queueing delay of the k-th packet, the average queueing delay and the worst delay (queueing + transmission). (1.5)<br>(b) Four clients download simultaneously from four servers through one shared core link of 8 Mbps (shared equally). Each server link is 3 Mbps and each client access link is 1.5 Mbps. Find the throughput of each download and the time to download a 9 MB file. (1.5)</p>`,marks:3,co:"CO2",ans:`<p><b>(a)</b> L = 1250 x 8 = 10,000 bits; d_trans = 10^4/10^7 = 1 ms. The k-th packet waits for the k−1 packets ahead: d_queue = (k−1) ms, so 0, 1, …, 9 ms. Average = 4.5 ms (= (N−1)L/2R). The last packet has total delay 9 + 1 = <b>10 ms</b>. This shows burstiness: even if the average load is small, a burst of N packets creates delay.</p><p><b>(b)</b> End-to-end throughput = min(R_s, R_c, R_core/4) = min(3, 1.5, 2) = <b>1.5 Mbps</b>; the bottleneck is the client's access link, not the core. File = 9 MB = 72 Mbit; time = 72/1.5 = <b>48 s</b>. (If the access link were 10 Mbps, the shared core share of 2 Mbps would be the bottleneck.)</p>`},
{q:`<p>An institution's access link is 1.5 Mbps. Browsers issue 15 requests/s for objects of average size 100,000 bits; the origin servers are on the Internet with a 2 s round trip delay (excluding the access link queueing); the LAN delay is 10 ms.</p><p>(a) Show the access link is saturated. (1)<br>(b) A web cache with a 40% hit rate is installed. Find the new access-link intensity, the average access-link delay (use Δ/(1−Δβ)) and the average response time. (1)<br>(c) Compare with upgrading the link to 15 Mbps, and explain how a conditional GET keeps cached objects fresh. (1)</p>`,marks:3,co:"CO1",ans:`<p><b>(a)</b> Δ = 100,000/1.5M = 0.0667 s per object; intensity = 15 x 0.0667 = 1.0, so queueing delay grows without bound.</p><p><b>(b)</b> Only misses cross the access link: β = 0.6 x 15 = 9 req/s, intensity = 9 x 0.0667 = <b>0.6</b>. Access delay = 0.0667/(1−0.6) = <b>0.1667 s</b>. Hits cost only the LAN delay (10 ms); misses cost LAN + Internet + access = 0.01 + 2 + 0.1667. Average = 0.4 x 0.01 + 0.6 x 2.1767 ≈ <b>1.31 s</b> (equivalently 0.01 + 0.6 x 2.1667).</p><p><b>(c)</b> With a 15 Mbps link: Δ = 0.00667 s, intensity 0.1, access delay = 0.00667/0.9 = 7.4 ms, response ≈ 0.01 + 2 + 0.0074 = <b>2.017 s</b>. The cache gives a lower average delay (1.31 s) and is cheaper than the upgrade, because it removes the 2 s Internet delay for 40% of the requests.</p><p>Conditional GET: the cache sends If-Modified-Since: &lt;date of cached copy&gt;; the origin answers 304 Not Modified (no body) if unchanged, otherwise 200 with the new object, so stale content is avoided without re-downloading the full object.</p>`},
{q:`<p>A 1 Gbit file is to be distributed from a server (upload 20 Mbps) to N = 10 peers, each with upload rate u = 2 Mbps and download rate d = 5 Mbps. Using the standard lower-bound formulas, compute the minimum distribution time for client-server and for P2P, and explain which term limits each.</p>`,marks:2,co:"CO2",ans:`<p>F = 1000 Mbit. <b>Client-server:</b> D = max(NF/u_s, F/d_min) = max(10x1000/20, 1000/5) = max(500, 200) = <b>500 s</b>; limited by the server having to upload N copies.</p><p><b>P2P:</b> D = max(F/u_s, F/d_min, NF/(u_s + Σu_i)) = max(1000/20, 1000/5, 10000/(20+20)) = max(50, 200, 250) = <b>250 s</b>; limited by total upload capacity of the system (the peers' uploads are part of it). The P2P time grows slowly with N (each new peer adds its own service capacity), while client-server time grows linearly in N.</p>`}
]},
{name:"Unit 2 — Transport Layer (12 marks)",note:"Q4 (4) + Q5 (4) + Q6 (4). All compulsory.",qs:[
{q:`<p>A TCP sender starts with cwnd = 1 MSS and ssthresh = 8 MSS. cwnd is as used in each RTT round. Three duplicate ACKs are received during round 8, when no earlier loss has occurred.</p><p>(a) Give cwnd for rounds 1–14 for TCP Tahoe. (2)<br>(b) Give cwnd for rounds 9–14 for TCP Reno and the extra segments Reno sends over those six rounds. (1)<br>(c) Explain why additive increase / multiplicative decrease is used and why exponential growth stops at ssthresh. (1)</p>`,marks:4,co:"CO2",ans:`<p><b>(a) Tahoe.</b> Slow start: 1, 2, 4, 8 (rounds 1–4). cwnd = ssthresh = 8 at round 4, so congestion avoidance: round 5: 9, 6: 10, 7: 11, 8: 12. In round 8 three dup ACKs: ssthresh = 12/2 = 6; cwnd = 1. Rounds 9–14: 1, 2, 4, 6 (capped at ssthresh), 7, 8.</p><table><tr><th>Round</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td></tr><tr><th>Tahoe</th><td>1</td><td>2</td><td>4</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>1</td><td>2</td><td>4</td><td>6</td><td>7</td><td>8</td></tr></table><p><b>(b) Reno.</b> ssthresh = 6, fast recovery then cwnd = 6 at round 9: rounds 9–14: 6, 7, 8, 9, 10, 11 (sum 51). Tahoe over the same rounds sends 1+2+4+6+7+8 = 28. Reno sends <b>23 more segments</b> because it never falls back to slow start.</p><p><b>(c)</b> AIMD: additive probing for more bandwidth, multiplicative back-off on loss: it converges to a fair and efficient share (the two-flow phase-plane argument). Slow start finds the bandwidth quickly (exponential), but once cwnd reaches ssthresh (half the window at last loss, i.e. the region where loss was previously seen) doubling would overshoot into congestion, so the growth is made linear.</p>`},
{q:`<p>Go-Back-N and Selective Repeat with window size N = 4 each send 7 packets numbered 0–6. Packet 2 is lost on its first transmission only; no other packet or ACK is lost; the timeout is long enough that all packets of the first window are sent before it expires. (GBN receiver sends ACK for the last in-order packet; SR receiver ACKs each packet and buffers out-of-order ones.)</p><p>(a) List the sequence of packets sent by the sender in each protocol and the total number of transmissions. (3)<br>(b) What is the minimum sequence number space for SR and for GBN? Show what goes wrong for SR with N = 4 and 5 sequence numbers. (1)</p>`,marks:4,co:"CO2",ans:`<p><b>GBN.</b> Send 0,1,2,3. 0 and 1 arrive: ACK0 and ACK1 slide the window, letting 4 and 5 be sent. Packet 2 is missing, so 3, 4 and 5 are discarded and the receiver re-ACKs 1 each time. Timeout on 2: resend <b>2,3,4,5</b>. ACKs 2,3,4,5 arrive and 6 is sent. Sequence: 0,1,2,3,4,5,2,3,4,5,6 = <b>11 transmissions</b>.</p><p><b>SR.</b> Send 0,1,2,3; ACK0 → send 4; ACK1 → window is 2–5, send 5; 3,4,5 arrive and are buffered and individually ACKed. The window base stays at 2, so 6 cannot be sent. Timeout of 2 only: resend <b>2</b>; delivering 2 releases 2–5 in order, the base jumps to 6, and 6 is sent. Sequence: 0,1,2,3,4,5,2,6 = <b>8 transmissions</b>. SR saves 3 retransmissions.</p><p><b>(b)</b> GBN needs N+1 = 5 distinct numbers (window N plus one). SR needs at least 2N = 8, because the sender window and the receiver window may be offset by up to N; with 5 numbers (0–4), N = 4, a retransmission of old packet 0 (after a lost ACK) looks like new packet 5 mod 5 = 0 to a receiver whose window has already moved to 0..3, so a duplicate is accepted as new data. With ≥ 2N numbers the old and new windows cannot overlap.</p>`},
{q:`<p>(a) Use the TCP throughput formula 1.22·MSS/(RTT·√L). MSS = 1460 B, RTT = 100 ms, loss rate L = 10^-4. Find the average throughput. (1)<br>(b) What loss rate would be needed to sustain 10 Gbps at MSS = 1500 B and RTT = 100 ms, and what does it say about standard TCP? (1)<br>(c) Two long-lived TCP flows share a bottleneck; flow 2 has twice the RTT of flow 1. Which obtains more throughput and why? Is TCP fair here? (1)<br>(d) Why is UDP chosen over TCP for DNS queries and what does the application have to provide on its own? (1)</p>`,marks:4,co:"CO2",ans:`<p><b>(a)</b> MSS = 11,680 bits; √L = 0.01. Throughput = 1.22 x 11680 / (0.1 x 0.01) = 14,249.6 / 0.001 = <b>14.25 Mbps</b>.</p><p><b>(b)</b> L = (1.22·MSS/(RTT·R))² = (1.22 x 12000 / (0.1 x 10^10))² = (1.464x10^-5)² ≈ <b>2.1x10^-10</b>, about one loss per 4.7 billion segments: unrealistic, so standard AIMD cannot fill such long fat pipes. This motivated TCP variants such as CUBIC, HighSpeed TCP and BBR.</p><p><b>(c)</b> Throughput ≈ W/RTT; with equal windows the flow with the smaller RTT grows its window faster (one MSS per RTT), so flow 1 gets about twice the share. AIMD equalises windows, not rates, so TCP is fair per connection only for equal RTTs; also an application opening many connections gets more bandwidth.</p><p><b>(d)</b> A DNS request/response fits in one datagram each, so avoiding the 1-RTT handshake and per-connection state makes queries faster and lets servers scale. The application must itself handle loss (timeout and retry, possibly another server) and ordering; with UDP there is no congestion control either.</p>`}
]},
{name:"Unit 3 — Network Layer (12 marks)",note:"Q7 (4) + Q8 (4) + Q9 (4). All compulsory.",qs:[
{q:`<p>An ISP owns 200.23.16.0/20. It gives A a /22, B a /23 and C and D one /24 each (allocated sequentially from the start of the block).</p><p>(a) Write the four prefixes. (1)<br>(b) Show how the ISP advertises them to the rest of the Internet. (1)<br>(c) A router has entries: 200.23.16.0/22 → 1; 200.23.20.0/23 → 2; 200.23.22.0/24 → 3; 200.23.23.0/24 → 4; 200.23.16.0/20 → 5; 0.0.0.0/0 → 6. Where are packets to 200.23.21.9, 200.23.23.200, 200.23.28.5 and 200.23.40.1 forwarded? (1)<br>(d) Organisation B moves to another ISP but keeps its addresses. How does the Internet still reach B? (1)</p>`,marks:4,co:"CO3",ans:`<p><b>(a)</b> A: 200.23.16.0/22 (16.0–19.255); B: 200.23.20.0/23 (20.0–21.255); C: 200.23.22.0/24; D: 200.23.23.0/24. Together these fill 200.23.16.0–200.23.23.255 = 200.23.16.0/21; 200.23.24.0/21 remains free.</p><p><b>(b)</b> The ISP advertises one aggregate, 200.23.16.0/20 (route aggregation / CIDR); the outside world needs a single entry instead of four.</p><p><b>(c)</b> 200.23.21.9 → matches /20, /22? no (16–19), /23 (20–21) yes → <b>2</b>. 200.23.23.200 → /24 (23.x) → <b>4</b>. 200.23.28.5 → inside /20 (16–31) but not inside any more specific entry → <b>5</b>. 200.23.40.1 → outside /20 → default <b>6</b>.</p><p><b>(d)</b> The new ISP advertises the more specific prefix 200.23.20.0/23. Routers prefer the longest match, so traffic for B follows that route even though the old ISP still advertises the /20 aggregate; the old ISP must be prepared to handle the hole, and the extra routing-table entry is the price of mobility of addresses.</p>`},
{q:`<p>Four routers have link costs A–B 1, A–C 4, B–C 2, B–D 6, C–D 3.</p><p>(a) Run synchronous distance-vector rounds until convergence; give the full vectors (to A,B,C,D) of all four nodes after rounds 0, 1 and 2. (2)<br>(b) In a different network x–y costs 4, y–z costs 1 and x–z costs 50. The cost of x–y rises to 60. Without poisoned reverse, give y's and z's first three estimates of the distance to x and explain the problem; show what poisoned reverse does. (2)</p>`,marks:4,co:"CO3",ans:`<p><b>(a)</b> Bellman–Ford: D_a(b) = min over neighbours n of c(a,n) + D_n(b). Round 0 contains only direct costs (99 = ∞).</p><table><tr><th>Node</th><th colspan="4">Round 0 (A B C D)</th><th colspan="4">Round 1</th><th colspan="4">Round 2 (final)</th></tr><tr><th>A</th><td>0</td><td>1</td><td>4</td><td>∞</td><td>0</td><td>1</td><td>3</td><td>7</td><td>0</td><td>1</td><td>3</td><td>6</td></tr><tr><th>B</th><td>1</td><td>0</td><td>2</td><td>6</td><td>1</td><td>0</td><td>2</td><td>5</td><td>1</td><td>0</td><td>2</td><td>5</td></tr><tr><th>C</th><td>4</td><td>2</td><td>0</td><td>3</td><td>3</td><td>2</td><td>0</td><td>3</td><td>3</td><td>2</td><td>0</td><td>3</td></tr><tr><th>D</th><td>∞</td><td>6</td><td>3</td><td>0</td><td>7</td><td>5</td><td>3</td><td>0</td><td>6</td><td>5</td><td>3</td><td>0</td></tr></table><p>Round 3 produces no change, so convergence is reached after 2 rounds. Examples: round 1, A to C: min(4, 1+2) = 3; A to D: via B 1+6 = 7. Round 2, A to D: via C (3 → now D_C(D)=3): min(7, 3+3) = 6.</p><p><b>(b)</b> Before the change y→x = 4 and z→x = 5 (via y). After c(x,y) = 60: y recomputes min(60, 1 + D_z(x)=5) = <b>6</b> (it believes z has a path, but z's path is through y!). z then computes min(50, 1+6) = <b>7</b>; y: 1+7 = <b>8</b>; z: 9; y: 10 … the two bounce the packet and increase by 2 per exchange, until the estimate reaches 50 (z's direct link): roughly two dozen exchanges — a routing loop and count to infinity.</p><p>Poisoned reverse: z routes to x through y, so it tells y D_z(x) = ∞. y then chooses min(60, 1+∞) = 60, tells z, z picks min(50, 1+60) = 50; y then 51. Convergence in two exchanges. (It does not solve loops involving three or more nodes.)</p>`},
{q:`<p>(a) A 4000-byte IPv4 datagram (20-byte header + 3980 bytes data) must cross a link of MTU 1500 bytes. Give the length, offset field and MF flag of each fragment. (2)<br>(b) The second fragment later meets a link with MTU 576 bytes. Give the resulting fragments. (1)<br>(c) Why are intra-AS routing (OSPF) and inter-AS routing (BGP) different protocols? (1)</p>`,marks:4,co:"CO3",ans:`<p><b>(a)</b> Data per fragment must be a multiple of 8 and ≤ 1500 − 20 = 1480 (1480 = 8 x 185 OK). Fragments: (1) total length 1500, offset 0, MF 1 (1480 data); (2) total length 1500, offset 185, MF 1 (1480 data); (3) total length 20 + 1020 = 1040, offset 370, MF 0 (3980 − 2960 = 1020 data). Check: 1480+1480+1020 = 3980.</p><p><b>(b)</b> MTU 576 → at most 556 data bytes, rounded down to a multiple of 8: 552. Fragment 2 (1480 data, offset 185, MF 1) becomes: 552 data (offset 185, MF 1), 552 data (offset 185+69 = 254, MF 1), 376 data (offset 254+69 = 323, MF 1, because more original data follows). Check 552+552+376 = 1480, and 323 + 376/8 = 323+47 = 370, which is the offset of fragment 3. Fragments are reassembled only at the destination, and the MF bit stays 1 for all pieces because fragment 2 is not the last piece of the original datagram.</p><p><b>(c)</b> Scale and autonomy: OSPF (link-state) optimises metric inside an AS under a single administrator, and can flood the full topology. BGP is policy-based: the administrators decide which neighbours' routes to accept and prefer (business relationships), and BGP exports only reachability (AS paths, prefixes), which scales to the whole Internet and hides internal topology.</p>`}
]},
{name:"Unit 4 — Link Layer and Wireless (8 marks)",note:"Q10 (4) + Q11 (4). Both compulsory.",qs:[
{q:`<p>(a) A classic Ethernet needs a minimum frame of 512 bits so that a sender is still transmitting when a collision reports back. For a 100 Mbps CSMA/CD segment with this minimum frame, find the maximum cable length (c = 2x10^8 m/s, ignore repeater delay). Repeat for 1 Gbps and say how gigabit Ethernet copes. (1.5)<br>(b) After the 3rd collision of a frame, what is the range of the backoff K, the mean waiting time at 100 Mbps, and the probability that two stations that have just collided for the first time collide again? (1.5)<br>(c) A 10 Mbps CSMA/CD LAN has a maximum propagation delay of 25.6 µs and carries 1500-byte frames. Estimate the efficiency 1/(1 + 5·d_prop/d_trans). (1)</p>`,marks:4,co:"CO1",ans:`<p><b>(a)</b> Round trip must be ≤ transmission time of the minimum frame: 512 bits / 100 Mbps = 5.12 µs, so one-way ≤ 2.56 µs; length = 2.56 µs x 2x10^8 = <b>512 m</b>. At 1 Gbps: 0.512 µs round trip, one way 0.256 µs, i.e. only <b>51.2 m</b>. Gigabit Ethernet therefore keeps the 512-bit slot but pads short frames by <b>carrier extension</b> to 4096 bits (and uses frame bursting); in practice switched full-duplex links make CSMA/CD irrelevant.</p><p><b>(b)</b> After the 3rd collision K is chosen uniformly from {0,…,2^3 −1} = {0,…,7}; each unit is 512 bit-times = 5.12 µs at 100 Mbps. Mean K = 3.5, so mean wait = 3.5 x 5.12 = <b>17.92 µs</b>. After the first collision K ∈ {0,1}; both pick the same value with probability 1/2, so the probability of colliding again is <b>1/2</b>. Binary exponential backoff adapts to the number of contending stations.</p><p><b>(c)</b> d_trans = 12,000 bits/10 Mbps = 1.2 ms; 5 x 25.6/1200 = 0.1067; efficiency = 1/1.1067 = <b>0.904 (about 90%)</b>. Efficiency falls with longer cables or shorter frames.</p>`},
{q:`<p>In an 802.11 BSS with access point B, stations A and C are both in range of B but cannot hear each other. Timing parameters: DIFS 34 µs, SIFS 16 µs, slot 9 µs; RTS, CTS, ACK frames each take 30 µs; A's data frame takes 200 µs.</p><p>(a) Why can CSMA/CD not be used in wireless LANs, and what is the hidden-terminal problem here? (1)<br>(b) Compute the time to deliver A's frame with and without RTS/CTS if the channel is idle and A's backoff is 0 slots. (1.5)<br>(c) What NAV value does C set on hearing B's CTS, and how does this solve the problem? Mention what A does if the channel is busy at the start. (1.5)</p>`,marks:4,co:"CO1",ans:`<p><b>(a)</b> A radio cannot transmit and listen at the same time (own signal swamps the received one), and collisions are in any case detected at the receiver, not at the sender, since fading and hidden nodes mean sender and receiver see different channels. So 802.11 uses CSMA/CA with ACKs. Hidden terminal: A transmits to B; C cannot sense A, finds the channel idle and transmits to B; the frames collide at B although each sender sensed an idle medium.</p><p><b>(b)</b> Without RTS/CTS: DIFS + DATA + SIFS + ACK = 34 + 200 + 16 + 30 = <b>280 µs</b>. With RTS/CTS: DIFS + RTS + SIFS + CTS + SIFS + DATA + SIFS + ACK = 34 + 30 + 16 + 30 + 16 + 200 + 16 + 30 = <b>372 µs</b>. The overhead of 92 µs is worth paying only for long frames or in the presence of hidden terminals, because a collision of RTS frames (30 µs) costs far less than a collision of the 200 µs data frame.</p><p><b>(c)</b> The CTS reserves the channel for the remaining exchange: NAV = SIFS + DATA + SIFS + ACK = 16 + 200 + 16 + 30 = <b>262 µs</b>. C hears B's CTS (C cannot hear A's RTS), sets its virtual carrier-sense (NAV) for 262 µs and stays silent although it may physically sense the medium as idle. If A finds the channel busy it defers until idle, waits DIFS, picks a random backoff in the contention window and decrements it per idle slot, freezing it while busy; the window doubles after each missing ACK.</p>`}
]}
]};</script><script src="../assets/exam.js"></script></body></html>
