<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mid-Term Examination (Paper 3)</title><link rel="stylesheet" href="../assets/style.css"></head><body><main><nav class="bc" aria-label="Breadcrumb"><a href="../../../index.html">Home</a><span>›</span><a href="../index.html">Computer Networks</a><span>›</span><a href="../index.html#exams">Exams</a><span>›</span><b aria-current="page">Mid-Term Examination (Paper 3)</b></nav><h1>Mid-Term Examination (Paper 3)</h1><p class="sub">Computer Networks · Syllabus: Weeks 1–7 (Introduction, Application layer, Transport layer up to TCP flow control)</p><p class="meta"><span>Time: 90 minutes</span><span>Max marks: 30</span></p><div id="app"></div>
<script>window.EXAM={instructions:["Answer all questions. Total 30 marks (Part A: 10, Part B: 12, Part C: 8).","Show all working for numeric problems and state units.","Assume 1 kbps = 10^3 bps, 1 Mbps = 10^6 bps, 1 Gbps = 10^9 bps, and 1 byte = 8 bits unless stated otherwise."],sections:[
{name:"Part A — Short answers",note:"5 questions × 2 marks = 10 marks. Answer in 3–4 lines.",qs:[
{q:"Define the network edge and the network core. Name two access technologies used at the edge.",marks:2,co:"CO1",ans:"<p>The <b>edge</b> consists of hosts (clients, servers) and the access networks connecting them to the first router: e.g. DSL, cable, FTTH, Ethernet/Wi-Fi LANs, cellular. The <b>core</b> is the mesh of interconnected routers and links that moves packets from source to destination using packet switching. (1 mark each part)</p>"},
{q:"A path has three links with rates 4 Mbps, 1 Mbps and 6 Mbps. What is the end-to-end throughput of a large file transfer when there is no other traffic? How long does a 2 MB file take (ignoring delays other than transmission)?",marks:2,co:"CO1",ans:"<p>Throughput = bottleneck link rate = min(4, 1, 6) = <b>1 Mbps</b>. (1 mark)</p><p>2 MB = 16 Mbit; time = 16 Mbit / 1 Mbps = <b>16 s</b>. (1 mark)</p>"},
{q:"Explain the meaning of the HTTP status codes 200, 301, 404 and 505.",marks:2,co:"CO1",ans:"<ul><li>200 OK: request succeeded; the object is in the body.</li><li>301 Moved Permanently: the object has a new URL given in the <code>Location:</code> header.</li><li>404 Not Found: the requested document does not exist on the server.</li><li>505 HTTP Version Not Supported.</li></ul><p>(0.5 mark each)</p>"},
{q:"Compare POP3 and IMAP for retrieving mail. When is IMAP preferable?",marks:2,co:"CO1",ans:"<p>POP3 has authorization and transaction phases and typically downloads and deletes mail from the server; it keeps no folder state across sessions. IMAP keeps all messages on the server, lets users create folders, move messages and fetch parts of a message, and maintains state across sessions. (1 mark)</p><p>IMAP is preferable when the user reads mail from several devices or has slow links (fetch headers only). (1 mark)</p>"},
{q:"In TCP socket programming the server has a 'welcome' socket and creates a new socket for every client. Explain why this is not needed in UDP.",marks:2,co:"CO1",ans:"<p>TCP is connection oriented: the welcome socket listens on the well-known port; <code>accept()</code> returns a new connection socket dedicated to that client (identified by the 4-tuple), giving a separate byte stream per client. (1 mark)</p><p>UDP is connectionless: a single socket receives datagrams from any client, and each datagram carries the sender's address, so the server replies using <code>sendto()</code> with that address; no per-client state is needed. (1 mark)</p>"}
]},
{name:"Part B — Medium problems",note:"3 questions × 4 marks = 12 marks.",qs:[
{q:"A file of F = 15 Gbit is distributed to N peers. The server upload rate is u<sub>s</sub> = 30 Mbps, every peer has download rate d<sub>i</sub> = 2 Mbps and upload rate u<sub>i</sub> = 300 kbps. Using D<sub>cs</sub> = max{NF/u<sub>s</sub>, F/d<sub>min</sub>} and D<sub>P2P</sub> ≥ max{F/u<sub>s</sub>, F/d<sub>min</sub>, NF/(u<sub>s</sub> + Σu<sub>i</sub>)}, compute the minimum distribution time for client-server and P2P for N = 10 and N = 100, and comment.",marks:4,co:"CO2",ans:"<p>F/d<sub>min</sub> = 15×10<sup>9</sup>/2×10<sup>6</sup> = 7500 s; F/u<sub>s</sub> = 500 s.</p><table><tr><th>N</th><th>Client-server</th><th>P2P</th></tr><tr><td>10</td><td>max{10×500 = 5000, 7500} = <b>7500 s</b></td><td>NF/(u<sub>s</sub>+Σu<sub>i</sub>) = 150×10<sup>9</sup>/33×10<sup>6</sup> = 4545 s; max{500, 7500, 4545} = <b>7500 s</b></td></tr><tr><td>100</td><td>max{100×500 = 50000, 7500} = <b>50,000 s</b></td><td>1500×10<sup>9</sup>/60×10<sup>6</sup> = 25,000 s; max{500, 7500, 25000} = <b>25,000 s</b></td></tr></table><p>(1 mark each for the four values.) <b>Comment:</b> For N = 10 both are limited by the slowest peer's download rate. For N = 100 the client-server time grows linearly with N (50,000 s), while P2P grows much more slowly because each new peer adds upload capacity: self-scalability.</p>"},
{q:"Consider a 3000 km link with propagation speed 2.5×10<sup>8</sup> m/s and rate R = 2 Mbps carrying a packet of 1500 bytes. (a) Compute d<sub>prop</sub> and d<sub>trans</sub>. (b) Does the last bit leave the sender before the first bit reaches the receiver? (c) What is the bandwidth-delay product of the link? (d) At what rate R would d<sub>trans</sub> equal d<sub>prop</sub>?",marks:4,co:"CO2",ans:"<p><b>(a)</b> d<sub>prop</sub> = 3×10<sup>6</sup> / 2.5×10<sup>8</sup> = <b>12 ms</b>; L = 12,000 bits; d<sub>trans</sub> = 12,000/2×10<sup>6</sup> = <b>6 ms</b>. (1 mark)</p><p><b>(b)</b> The last bit leaves at t = 6 ms; the first bit arrives at t = 12 ms. Since 6 &lt; 12 the last bit has already left <b>before</b> the first bit arrives: the packet is spread out along the link. (1 mark)</p><p><b>(c)</b> BDP = R × d<sub>prop</sub> = 2×10<sup>6</sup> × 0.012 = <b>24,000 bits</b>, the maximum number of bits in flight (2 packets' worth). (1 mark)</p><p><b>(d)</b> L/R = 0.012 s ⇒ R = 12,000/0.012 = <b>1 Mbps</b>. (1 mark)</p>"},
{q:"Compute the UDP checksum for a segment whose data (treat the whole segment as three 16-bit words) is 0x4E3F, 0xA1B2, 0x7C05. Show the wraparound. Then explain how the receiver verifies it and whether a single bit flip is always detected.",marks:4,co:"CO2",ans:"<p>Step 1: 0x4E3F + 0xA1B2 = 0xEFF1 (no carry out). (1 mark)</p><p>Step 2: 0xEFF1 + 0x7C05 = 0x16BF6; the carry out of bit 16 is wrapped around: 0x6BF6 + 1 = <b>0x6BF7</b> (binary 0110 1011 1111 0111). (1 mark)</p><p>Step 3: 1s complement of the sum: 0xFFFF − 0x6BF7 = <b>0x9408</b> (binary 1001 0100 0000 1000). (1 mark)</p><p><b>Verification:</b> the receiver adds all words including the checksum: 0x6BF7 + 0x9408 = 0xFFFF (all 1s) if there is no error; any 0 bit signals an error. A single bit flip changes the sum, so it is always detected; some multi-bit errors can cancel and go undetected. (1 mark)</p>"}
]},
{name:"Part C — Transport layer problems",note:"2 questions × 4 marks = 8 marks.",qs:[
{q:"Host C runs a UDP server socket on port 5000 and a TCP web server on port 80. (a) Hosts A (IP a) and B (IP b) both send UDP datagrams from source port 7000 to C:5000. How many UDP sockets at C receive them, and how does C reply to each? (b) Client A opens two simultaneous TCP connections to C:80 from ports 6001 and 6002, and B opens one from port 6001. How many TCP connection sockets (excluding the welcome socket) exist at C, and which four-tuples identify them? (c) Would the demultiplexing change if the web server used one process or one thread per connection? Explain.",marks:4,co:"CO3",ans:"<p><b>(a)</b> UDP demultiplexing uses only (dest IP, dest port): both datagrams go to the <b>one</b> socket at C:5000, even though the source IPs differ. C reads the source IP/port from each datagram (a:7000 or b:7000) and replies to it. (1.5 marks)</p><p><b>(b)</b> TCP uses the 4-tuple: three connection sockets: (a, 6001, C, 80), (a, 6002, C, 80), (b, 6001, C, 80). Segments with the same destination port 80 reach different sockets because the source IP/port differ (source port 6001 alone is ambiguous between A and B). (1.5 marks)</p><p><b>(c)</b> No. Demultiplexing is done by the transport layer on the 4-tuple to a socket; whether a process or thread serves that socket is an application matter. Per-connection processes/threads simply each own one connection socket, while the welcome socket stays in the listening process. (1 mark)</p>"},
{q:"A TCP sender transmits five segments of 500 bytes each with sequence numbers 1000, 1500, 2000, 2500 and 3000 (the receiver initially expects byte 1000). The segment with seq 1500 is lost; all others arrive; the receiver ACKs every segment immediately and buffers out-of-order data. (a) Write down the ACK numbers the receiver sends for each arriving segment. (b) At which point does fast retransmit trigger, and what is retransmitted? (c) What ACK number does the receiver send after the retransmitted segment arrives? (d) Why is fast retransmit useful compared with waiting for the timeout?",marks:4,co:"CO3",ans:"<p><b>(a)</b> Seg 1000 → ACK 1500. Seg 1500 lost. Seg 2000 arrives out of order → duplicate ACK 1500 (dup #1). Seg 2500 → ACK 1500 (dup #2). Seg 3000 → ACK 1500 (dup #3). (1.5 marks)</p><p><b>(b)</b> Fast retransmit triggers on the <b>third duplicate ACK</b> (i.e. four ACKs for 1500 in total): the sender retransmits the segment starting at byte 1500 immediately, before its timer expires. (1 mark)</p><p><b>(c)</b> The receiver already holds 2000–3499, so when 1500–1999 arrives the cumulative ACK jumps to <b>3500</b>. (1 mark)</p><p><b>(d)</b> Timeout intervals are long (EstimatedRTT + 4·DevRTT), so waiting leaves the pipe idle; three duplicate ACKs are strong evidence of loss while later segments are still being delivered, so recovery occurs within about one RTT. (0.5 mark)</p>"}
]}
]};</script><script src="../assets/exam.js"></script></main></body></html>
