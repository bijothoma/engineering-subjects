<script>window.EXAM={instructions:["Answer ALL questions. Marks are shown against each question; the paper totals 40 (Unit 1: 8, Unit 2: 12, Unit 3: 12, Unit 4: 8).","Show every step of numeric work and state assumptions (1 Mbps = 10^6 bit/s, 1 MB = 8x10^6 bits, unless stated).","Use the Show answer buttons only after attempting the question; the model answers contain full working."],
sections:[
{name:"Unit 1 — Introduction and Application Layer (8 marks)",note:"Q1 (3) + Q2 (3) + Q3 (2). All compulsory.",qs:[
{q:`<p>Host A sends a file of 6 Mbit (6x10^6 bits) to host B over a path A — R1 — R2 — B (three links, two store-and-forward routers). Link rates: A–R1 100 Mbps, R1–R2 20 Mbps, R2–B 50 Mbps. Propagation delays: 2 ms, 5 ms, 3 ms respectively. Ignore processing and queueing other than that caused by the rate mismatch.</p><p>(a) The file is cut into 500 packets of 12000 bits each. Find the time from the first bit leaving A to the last bit arriving at B, and the average end-to-end throughput. (2)<br>(b) Repeat for the case where the whole file is sent as one message (no segmentation) and state what the comparison shows. (1)</p>`,marks:3,co:"CO2",ans:`<p><b>(a)</b> Transmission time of one packet on each link: 12000/100M = 0.12 ms; 12000/20M = 0.6 ms; 12000/50M = 0.24 ms. Total propagation = 2+5+3 = 10 ms.</p><p>The first packet needs 0.12+0.6+0.24+10 = <b>10.96 ms</b> to arrive. The middle link (20 Mbps) is the bottleneck: it can emit one packet every 0.6 ms. Link 1 is faster, so packets queue at R1; link 3 is faster than link 2, so no queue builds at R2. Hence the remaining 499 packets arrive one every 0.6 ms:</p><p>T = 10.96 + 499 x 0.6 = 10.96 + 299.4 = <b>310.36 ms</b>.</p><p>Throughput = 6x10^6 / 0.31036 s = <b>about 19.33 Mbps</b>, very close to the bottleneck rate of 20 Mbps (the gap is the pipeline-fill time).</p><p><b>(b)</b> No segmentation: each link must receive the whole message before the router forwards it: 6M/100M + 6M/20M + 6M/50M = 60 + 300 + 120 = 480 ms, plus 10 ms propagation = <b>490 ms</b> (throughput 12.2 Mbps).</p><p>Segmentation lets the three links work simultaneously (pipelining), saving 179.64 ms here. Without it the transmission delays of the links simply add; with it only the bottleneck link dominates.</p>`},
{q:`<p>A browser fetches a page consisting of one base HTML file and 6 small embedded objects from one server. RTT to the server is 100 ms; object transmission times are negligible. The server name needs one DNS lookup costing 60 ms in total before any TCP connection is opened. Compute the total time to display the page for:</p><p>(a) non-persistent HTTP, objects fetched one after another; (b) non-persistent HTTP with 3 parallel connections after the base file arrives; (c) persistent HTTP with pipelining; (d) persistent HTTP without pipelining. State the formula (number of RTTs) used in each case.</p>`,marks:3,co:"CO1",ans:`<p>Non-persistent: every object costs 1 RTT for the TCP handshake + 1 RTT for request/response = 2 RTT. Persistent: the handshake is paid once.</p><p><b>(a)</b> 7 objects x 2 RTT = 14 RTT = 1400 ms; plus DNS 60 = <b>1460 ms</b>.<br><b>(b)</b> Base file 2 RTT. The 6 objects go in 3 parallel connections, i.e. 2 batches x 2 RTT = 4 RTT. Total 6 RTT = 600 ms + 60 = <b>660 ms</b>.<br><b>(c)</b> 1 RTT handshake + 1 RTT base file + 1 RTT for all 6 pipelined requests = 3 RTT = 300 ms + 60 = <b>360 ms</b>.<br><b>(d)</b> 1 RTT handshake + 1 RTT base + 6 x 1 RTT sequential = 8 RTT = 800 + 60 = <b>860 ms</b>.</p><p>Marking: 1 mark for (a)+(b), 1 for (c)+(d), 1 for correct RTT accounting and DNS being added once. Observation: persistent+pipelining is more than 4 times faster than the naive scheme because the latency, not the bandwidth, is the bottleneck.</p>`},
{q:`<p>An e-mail is sent from alice@a.edu to bob@b.org. (a) Name the protocol used on each of the three hops (Alice's agent to her server, server to server, Bob's server to Bob's agent) and say which hops are push and which are pull. (b) Why does Alice's mail server not simply deliver directly to Bob's laptop, and why can't SMTP be used for the last hop? (c) Give one reason to prefer IMAP over POP3.</p>`,marks:2,co:"CO1",ans:`<p><b>(a)</b> Alice's UA to a.edu server: SMTP (push, over TCP). a.edu server to b.org server: SMTP (push; the sender's server acts as the SMTP client and opens the connection, retrying if b.org is down). b.org server to Bob: POP3, IMAP or HTTP(S) webmail (pull; Bob's agent initiates the retrieval).</p><p><b>(b)</b> A user's laptop is not always on or reachable with a fixed address, so mail is stored in an always-on mailbox server which the user pulls from. SMTP is a push protocol (the client sends to the server); the last hop has to be initiated by the receiver, so a retrieval protocol is needed.</p><p><b>(c)</b> IMAP keeps messages and folder state on the server and allows partial fetch and multiple devices to stay in sync, whereas classic POP3 downloads (and usually deletes) mail so state is held at one client.</p>`}
]},
{name:"Unit 2 — Transport Layer (12 marks)",note:"Q4 (4) + Q5 (4) + Q6 (4). All compulsory.",qs:[
{q:`<p>A TCP Reno sender starts with cwnd = 1 MSS and ssthresh = 16 MSS. Time is measured in RTT rounds; cwnd given for a round is the value used during that round. A loss is detected by <b>three duplicate ACKs during round 10</b> and a <b>timeout during round 14</b>. After fast recovery the sender continues in congestion avoidance with cwnd = ssthresh at the start of the next round. Assume ssthresh is halved with integer floor.</p><p>(a) Tabulate cwnd for rounds 1–19. (2)<br>(b) Give ssthresh after each loss event and the total segments sent in rounds 1–5. (1)<br>(c) What would cwnd be at round 11 if this were TCP Tahoe? Why does Reno treat the two loss events differently? (1)</p>`,marks:4,co:"CO2",ans:`<p><b>(a)</b> Slow start doubles per round until ssthresh (16), then additive increase of 1 MSS per RTT.</p><table><tr><th>Round</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>cwnd</th><td>1</td><td>2</td><td>4</td><td>8</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td></tr></table><p>Round 10 (cwnd 21): 3 dup ACKs, ssthresh = floor(21/2) = 10, cwnd becomes ssthresh+3 = 13 during recovery, deflates to 10 on the new ACK.</p><table><tr><th>Round</th><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td></tr><tr><th>cwnd</th><td>10</td><td>11</td><td>12</td><td>13</td><td>1</td><td>2</td><td>4</td><td>6</td><td>7</td></tr></table><p>Round 14 (cwnd 13): timeout, ssthresh = floor(13/2) = 6, cwnd = 1, slow start: 1, 2, 4, then 8 would exceed ssthresh so cwnd is capped at 6 (round 18) and congestion avoidance gives 7 (round 19).</p><p><b>(b)</b> ssthresh = 10 after the dup-ACK event, 6 after the timeout. Segments in rounds 1–5 = 1+2+4+8+16 = <b>31</b>.</p><p><b>(c)</b> Tahoe sets cwnd = 1 even for triple dup ACK (ssthresh = 10), so round 11 gives cwnd = 1. Reno separates the events: three duplicate ACKs prove the network is still delivering packets (later segments got through), so a mild response (halve, fast recovery) suffices; a timeout signals severe congestion, so Reno restarts from 1 MSS.</p>`},
{q:`<p>(a) A TCP sender has EstimatedRTT = 100 ms and DevRTT = 10 ms. Using α = 1/8, β = 1/4, the next two SampleRTTs are 120 ms and 90 ms. Compute EstimatedRTT, DevRTT and TimeoutInterval after each sample. (2)</p><p>(b) A sender transmits three segments of data: A (seq 1000, 500 B), B (seq 1500, 500 B), C (seq 2000, 300 B). Segment B is lost on its first transmission. Write the ACK sent by the receiver for each arriving segment, say when the sender retransmits B, and the ACK after B arrives given that the receiver buffers out-of-order data. (2)</p>`,marks:4,co:"CO2",ans:`<p><b>(a)</b> EstimatedRTT = 0.875 EstimatedRTT + 0.125 Sample; DevRTT = 0.75 DevRTT + 0.25 |Sample − EstimatedRTT(new)|; Timeout = EstimatedRTT + 4 DevRTT.</p><p>Sample 120: Est = 87.5 + 15 = <b>102.5</b>; Dev = 7.5 + 0.25 x 17.5 = 7.5 + 4.375 = <b>11.875</b>; RTO = 102.5 + 47.5 = <b>150 ms</b>.<br>Sample 90: Est = 0.875 x 102.5 + 11.25 = <b>100.9375</b>; Dev = 0.75 x 11.875 + 0.25 x 10.9375 = 8.906 + 2.734 = <b>11.641</b>; RTO = 100.9375 + 46.5625 = <b>147.5 ms</b>.</p><p><b>(b)</b> A arrives: expected next byte 1500, so ACK 1500. B is lost. C arrives (out of order): receiver still needs 1500 so sends duplicate ACK 1500 (and buffers C). Two further dup ACKs would trigger fast retransmit; otherwise the sender retransmits B when its timer (RTO) expires or after 3 dup ACKs. When B arrives, bytes 1000–2299 are contiguous (C was buffered), so the receiver sends cumulative <b>ACK 2300</b>, which acknowledges A, B and C at once. Key point: TCP ACKs are cumulative and carry the next expected byte number, not the number of the segment received.</p>`},
{q:`<p>A stop-and-wait protocol is run over a 1 Gbps link with one-way propagation delay 15 ms and 8000-bit packets (ACK transmission time ignored).</p><p>(a) Compute the sender utilisation and the achieved throughput. (1)<br>(b) What window size N (in packets) is needed for 98% utilisation? (1)<br>(c) How many bits of sequence number are required for that N with Go-Back-N and with Selective Repeat? Justify. (1)<br>(d) Explain, with reference to your result, why TCP needs window scaling and why a receiver window alone cannot give this throughput. (1)</p>`,marks:4,co:"CO2",ans:`<p><b>(a)</b> d_trans = 8000/10^9 = 8 µs. RTT = 30 ms. U = (L/R)/(RTT + L/R) = 0.008 / 30.008 = <b>0.000267 (0.0267%)</b>. Throughput = 8000 bits / 30.008 ms = <b>about 266.6 kbit/s</b> on a 1 Gbps link.</p><p><b>(b)</b> U(N) = N x 0.008/30.008. For 0.98: N = 0.98 x 30.008 / 0.008 = 3675.98, so <b>N = 3676 packets</b> in flight.</p><p><b>(c)</b> Go-Back-N needs N+1 distinct numbers (window plus one so that an old ACK/retransmission is not confused): 3677 ≤ 2^12 = 4096, so <b>12 bits</b>. Selective Repeat needs a space of at least 2N = 7352 (receiver and sender windows must not overlap after wrap-around), 7352 ≤ 2^13 = 8192, so <b>13 bits</b>.</p><p><b>(d)</b> The bandwidth-delay product here is 10^9 x 0.03 = 30 Mbit ≈ 3.75 MB, far larger than the default 64 KB (16-bit) advertised window. Window scaling multiplies the 16-bit field by a power of two so that rwnd can reach the BDP; otherwise the sender would stall waiting for ACKs and utilise only a tiny fraction of the link.</p>`}
]},
{name:"Unit 3 — Network Layer (12 marks)",note:"Q7 (4) + Q8 (4) + Q9 (4). All compulsory.",qs:[
{q:`<p>An organisation owns 192.168.10.0/24 and wants separate subnets (using VLSM, largest first, allocating from the low end) for networks needing 100, 50, 25 and 10 hosts.</p><p>(a) Give each subnet's prefix, mask, address range and broadcast address, and the unused space. (2)<br>(b) A router has the table: 192.168.10.0/24 → if3; 192.168.10.128/25 → if1; 192.168.10.192/27 → if2. Where are datagrams to 192.168.10.20, .150, .200 and .250 forwarded and why? (2)</p>`,marks:4,co:"CO3",ans:`<p><b>(a)</b> Each subnet needs hosts + 2 (network and broadcast): 102 → 128 (/25); 52 → 64 (/26); 27 → 32 (/27); 12 → 16 (/28).</p><table><tr><th>Need</th><th>Prefix</th><th>Mask</th><th>Range (usable)</th><th>Broadcast</th></tr><tr><td>100</td><td>192.168.10.0/25</td><td>255.255.255.128</td><td>.1–.126</td><td>.127</td></tr><tr><td>50</td><td>192.168.10.128/26</td><td>255.255.255.192</td><td>.129–.190</td><td>.191</td></tr><tr><td>25</td><td>192.168.10.192/27</td><td>255.255.255.224</td><td>.193–.222</td><td>.223</td></tr><tr><td>10</td><td>192.168.10.224/28</td><td>255.255.255.240</td><td>.225–.238</td><td>.239</td></tr></table><p>Unused: 192.168.10.240/28 (16 addresses). Largest-first allocation keeps every block aligned to its size; allocating the small ones first would leave unaligned holes.</p><p><b>(b)</b> Longest-prefix match: .20 matches only /24 → <b>if3</b>. .150 matches /24 and /25 (128–255) → longest is /25 → <b>if1</b>. .200 matches /24, /25 and /27 (192–223) → <b>if2</b>. .250 is in /25 but not in the /27 (192–223) → <b>if1</b>. The more specific route overrides the aggregate even though both match.</p>`},
{q:`<p>Run Dijkstra's link-state algorithm at node A on the graph with link costs A–B 4, A–C 2, B–C 1, B–D 5, C–D 8, C–E 10, D–E 2, D–F 6, E–F 3.</p><p>(a) Show the table (N′, D(v), p(v)) at each step. (2)<br>(b) Give the resulting forwarding table of A and the least-cost path to F. (1)<br>(c) State the number of messages/time complexity considerations of link-state versus the information each router needs. (1)</p>`,marks:4,co:"CO3",ans:`<p><b>(a)</b></p><table><tr><th>Step</th><th>N′</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr><tr><td>0</td><td>A</td><td>4,A</td><td>2,A</td><td>∞</td><td>∞</td><td>∞</td></tr><tr><td>1</td><td>AC</td><td>3,C</td><td>–</td><td>10,C</td><td>12,C</td><td>∞</td></tr><tr><td>2</td><td>ACB</td><td>–</td><td>–</td><td>8,B</td><td>12,C</td><td>∞</td></tr><tr><td>3</td><td>ACBD</td><td></td><td></td><td>–</td><td>10,D</td><td>14,D</td></tr><tr><td>4</td><td>ACBDE</td><td></td><td></td><td></td><td>–</td><td>13,E</td></tr><tr><td>5</td><td>ACBDEF</td><td colspan="5">done</td></tr></table><p>Step 1 picks C (2): B improves 4 → 2+1 = 3. Step 2 picks B (3): D improves 10 → 3+5 = 8. Step 3 picks D (8): E improves 12 → 10, F = 14. Step 4 picks E (10): F improves 14 → 13.</p><p><b>(b)</b> Costs from A: B 3, C 2, D 8, E 10, F 13. Predecessors: B←C, C←A, D←B, E←D, F←E. Path to F: A–C–B–D–E–F (2+1+5+2+3 = 13). Forwarding table of A: every destination (B, C, D, E, F) uses next hop C, since even B is cheaper via C (3) than directly (4).</p><p><b>(c)</b> Link-state needs the complete topology and all costs at every router (flooded by n routers' LSAs, O(nE) messages). Each router then runs Dijkstra locally: O(n²) with a simple scan, O(E log n) with a heap. This is why LS converges fast and is robust against a single wrong router, but needs more state than distance vector.</p>`},
{q:`<p>(a) A home router has WAN address 138.76.29.7. Host H1 (10.0.0.1, source port 3345) opens a connection to web server 128.119.40.186:80. The NAT chooses port 5001. Write the NAT table entry and the source and destination fields of (i) the datagram that leaves the router and (ii) the server's reply as it enters the router and as it leaves toward H1. Then H2 (10.0.0.2) also uses source port 3345; what happens? (2)<br>(b) List the four DHCP messages with their source and destination addresses and what each carries. (1)<br>(c) Why can an external client not open a connection to a web server sitting behind the NAT, and give one remedy. (1)</p>`,marks:4,co:"CO3",ans:`<p><b>(a)</b> NAT table: 138.76.29.7 : 5001 ↔ 10.0.0.1 : 3345.<br>(i) Outgoing: src 138.76.29.7:5001, dst 128.119.40.186:80.<br>(ii) Reply entering: src 128.119.40.186:80, dst 138.76.29.7:5001; after translation toward H1: dst 10.0.0.1:3345 (src unchanged).<br>H2 using port 3345 is no problem because the NAT picks a fresh external port, e.g. 138.76.29.7:5002 ↔ 10.0.0.2:3345; the port field (16 bits) allows about 60,000 simultaneous connections through one public IP. The router must also recompute the IP and TCP/UDP checksums.</p><p><b>(b)</b> DHCP discover: src 0.0.0.0:68, dst 255.255.255.255:67 (client looks for a server). DHCP offer: from the server to broadcast (client has no address yet) carrying the offered address, mask, lease. DHCP request: client to broadcast, echoing the chosen offer. DHCP ACK: server confirms, adds gateway, DNS server and lease time.</p><p><b>(c)</b> An unsolicited packet arrives at the WAN address with no matching table entry, so the NAT cannot know which internal host it is for. Remedy: static port forwarding (a permanent entry such as WAN:80 → 10.0.0.5:80), UPnP, or a relay/hole punching. NAT also breaks the end-to-end principle, which is a motivation for IPv6.</p>`}
]},
{name:"Unit 4 — Link Layer and Wireless (8 marks)",note:"Q10 (4) + Q11 (4). Both compulsory.",qs:[
{q:`<p>The generator is G = 1101 (x^3 + x^2 + 1) and the data is D = 1011001.</p><p>(a) Compute the CRC bits and the transmitted frame by modulo-2 division. (2)<br>(b) The third bit from the left of the frame is flipped in transit. Show that the receiver detects the error. (1)<br>(c) Which error patterns is any CRC with r check bits guaranteed to detect? (1)</p>`,marks:4,co:"CO1",ans:`<p><b>(a)</b> Append r = 3 zeros: 1011001000, divide by 1101 (XOR, no borrows).</p><pre>1011001000
1101            (XOR at bit 0)
0110001000
 1101           (XOR at bit 1)
0000101000
     1101       (XOR at bit 4)
0000011100
      1101      (XOR at bit 5)
0000000110      remainder = 110
</pre><p>Each step cancels the leading 1 with an XOR of 1101 aligned under it; the process ends when no leading 1 remains in the first 7 positions. The remainder is <b>R = 110</b>. Transmitted frame = D followed by R = <b>1011001110</b>. Check: dividing 1011001110 by 1101 leaves 000.</p><p><b>(b)</b> Received 1001001110. Dividing by 1101 gives the non-zero remainder 001, so the error is detected (the error polynomial x^7 is not divisible by G because G has a non-zero constant term and x is coprime to it).</p><p><b>(c)</b> All single-bit errors (if G has more than one term), all odd numbers of errors when (x+1) divides G, all double errors for a suitable G, and every burst of length ≤ r bits; bursts of length r+1 slip through with probability 2^-(r-1), longer bursts with 2^-r. Here r = 3: any burst up to 3 bits is detected.</p>`},
{q:`<p>Switch S1 has ports 1 (host A), 2 (host B) and 3 (link to S2). Switch S2 has ports 1 (link to S1), 2 (host C) and 3 (host D). Both tables are initially empty and ARP caches are full, so all frames are unicast. The following frames are sent in order: (1) A→C, (2) C→A, (3) B→A, (4) D→C, (5) A→D.</p><p>(a) For each frame state which ports of S1 and S2 the frame is forwarded/flooded to, and what each switch learns. (3)<br>(b) Give the final switch tables, and say what a VLAN adds to this picture. (1)</p>`,marks:4,co:"CO1",ans:`<p><b>(a)</b> Self-learning: the source address and arrival port are recorded; if the destination is unknown the frame is flooded on all other ports; if known on the arrival port it is filtered; otherwise forwarded on that port only.</p><table><tr><th>#</th><th>S1</th><th>S2</th></tr><tr><td>1 A→C</td><td>learns A@1; C unknown, flood to 2 and 3</td><td>receives on 1; learns A@1; C unknown, flood to 2 and 3 (C receives, D also hears it and discards)</td></tr><tr><td>2 C→A</td><td>arrives on 3; learns C@3; A@1 → forward to 1 only</td><td>learns C@2; A@1 → forward on port 1 only</td></tr><tr><td>3 B→A</td><td>learns B@2; A@1 → port 1 only</td><td>never sees the frame (filtered by S1)</td></tr><tr><td>4 D→C</td><td>never sees it (S2 sends it only to port 2)</td><td>learns D@3; C@2 → port 2 only</td></tr><tr><td>5 A→D</td><td>refreshes A@1; D unknown at S1 → flood to 2 and 3 (B discards)</td><td>A@1 refreshed; D@3 → port 3 only</td></tr></table><p><b>(b)</b> Final S1: A→1, C→3, B→2 (D never learned). S2: A→1, C→2, D→3. Note S1 never learns D because frame 4 never crosses S1, so frame 5 floods once.</p><p>A VLAN splits one physical switch into several broadcast domains (port-based or tagged with 802.1Q). Flooding of unknown/broadcast frames is confined to ports of the same VLAN, which limits broadcast load and gives isolation; traffic between VLANs must be routed.</p>`}
]}
]};</script><script src="../assets/exam.js"></script></body></html>
