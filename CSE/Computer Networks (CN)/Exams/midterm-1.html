<script>window.EXAM={instructions:["Answer all questions. Total 30 marks (Part A: 10, Part B: 12, Part C: 8).","Show all working for numeric problems and state units.","Assume 1 kbps = 10^3 bps, 1 Mbps = 10^6 bps, 1 Gbps = 10^9 bps, and 1 byte = 8 bits unless stated otherwise."],sections:[
{name:"Part A — Short answers",note:"5 questions × 2 marks = 10 marks. Answer in 3–4 lines.",qs:[
{q:"Distinguish circuit switching from packet switching. Give one advantage of each.",marks:2,co:"CO1",ans:"<p><b>Circuit switching:</b> a dedicated end-to-end path (bandwidth reserved via FDM/TDM) is set up before data flows and held for the whole call. <b>Packet switching:</b> data is split into packets that are forwarded hop by hop (store-and-forward) and share links on demand.</p><ul><li>Circuit switching advantage: guaranteed, constant rate and delay (good for voice); no queueing once set up. (1 mark for the difference, 1/2 mark per advantage)</li><li>Packet switching advantage: statistical multiplexing gives better link utilisation, no call set-up, simpler. (Cost: queueing delay and possible loss.)</li></ul>"},
{q:"List the four components of nodal delay and state which of them depends on the packet length L.",marks:2,co:"CO1",ans:"<p>d<sub>nodal</sub> = d<sub>proc</sub> + d<sub>queue</sub> + d<sub>trans</sub> + d<sub>prop</sub>.</p><ul><li>Processing (header check, route lookup), queueing (waiting for the link), transmission (L/R), propagation (d/s).</li><li>Transmission delay L/R depends directly on L. Queueing delay depends on L only indirectly (traffic intensity La/R). Propagation delay depends on distance and medium, not on L.</li></ul>"},
{q:"What problem do cookies solve in HTTP, and what are the four components of a cookie mechanism?",marks:2,co:"CO1",ans:"<p>HTTP is stateless: the server keeps no memory of earlier requests. Cookies let a site identify a user across requests (shopping carts, sessions).</p><p>Four components: (1) a <code>Set-Cookie:</code> header in the HTTP response, (2) a <code>Cookie:</code> header in later requests, (3) a cookie file kept on the user's host and managed by the browser, (4) a back-end database at the site keyed by the cookie ID.</p>"},
{q:"What is the difference between an iterative and a recursive DNS query? Which one does a host normally use towards its local DNS server?",marks:2,co:"CO1",ans:"<p><b>Recursive:</b> the queried server takes the whole burden of resolving the name and returns the final answer. <b>Iterative:</b> the queried server replies with either the answer or a referral (the name of the next server to ask) and the requester contacts the next server itself.</p><p>A host normally sends a <b>recursive</b> query to its local DNS server, which then usually resolves iteratively against root, TLD and authoritative servers.</p>"},
{q:"A UDP socket is identified by a 2-tuple, whereas a TCP socket is identified by a 4-tuple. State both tuples and explain why the TCP server needs the larger one.",marks:2,co:"CO1",ans:"<p>UDP: (destination IP, destination port). TCP: (source IP, source port, destination IP, destination port).</p><p>A TCP server keeps a separate connection socket for every client, all sharing the same destination port (e.g. 80). Segments from different clients can only be demultiplexed to the right socket if the source IP and source port are also examined. UDP segments from different sources with the same destination port all reach the same socket.</p>"}
]},
{name:"Part B — Medium problems",note:"3 questions × 4 marks = 12 marks.",qs:[
{q:"A 2 Mbps link is shared by users. Each user, when active, transmits at 200 kbps, and a user is active only 10% of the time (users are independent). (a) How many users can circuit switching support? (b) With packet switching there are 20 users. Find the probability that more than 10 users are active at the same time, and comment. [Hint: P = Σ C(20,k)(0.1)<sup>k</sup>(0.9)<sup>20−k</sup>, k = 11…20.]",marks:4,co:"CO2",ans:"<p><b>(a)</b> Circuit switching reserves 200 kbps per user: 2 Mbps / 200 kbps = <b>10 users</b> (1 mark).</p><p><b>(b)</b> If at most 10 users are active, the link (2 Mbps) can carry all active traffic with no queueing. The number of active users X ~ Binomial(20, 0.1). (1 mark for the model)</p><p>P(X &gt; 10) = Σ<sub>k=11..20</sub> C(20,k)(0.1)<sup>k</sup>(0.9)<sup>20−k</sup> ≈ <b>7.09 × 10<sup>−7</sup></b> (computed numerically; dominated by the k = 11 term). (1 mark)</p><p><b>Comment:</b> Mean active users = 20 × 0.1 = 2. Packet switching supports 20 users (twice the circuit-switched count) while the link is overloaded for less than one part in a million of the time: statistical multiplexing gain. (1 mark)</p>"},
{q:"A source sends a message made of 3 packets of 1500 bytes each, back to back, to a destination over a path with two store-and-forward routers (three links). Each link has R = 10 Mbps and propagation delay 2 ms. Ignore processing and any queueing other than that caused by the packet stream itself. (a) Find the transmission delay of one packet on one link. (b) Find the time for the first packet to be fully received at the destination. (c) Find the time for all 3 packets to be fully received. (d) What would (c) be if the 4500 bytes were sent as a single packet?",marks:4,co:"CO2",ans:"<p><b>(a)</b> L = 1500×8 = 12,000 bits; d<sub>trans</sub> = 12,000/10×10<sup>6</sup> = <b>1.2 ms</b>.</p><p><b>(b)</b> One packet crosses 3 links, each costing d<sub>trans</sub> + d<sub>prop</sub> = 1.2 + 2 = 3.2 ms: 3 × 3.2 = <b>9.6 ms</b>.</p><p><b>(c)</b> Pipelining: each later packet arrives one transmission time (1.2 ms) after the previous one (all links have equal rate). Total = 9.6 + 2 × 1.2 = <b>12.0 ms</b>.</p><p><b>(d)</b> Single packet of 36,000 bits: d<sub>trans</sub> = 3.6 ms per link; total = 3 × (3.6 + 2) = <b>16.8 ms</b>. Segmentation reduces delay because later links start sending while earlier ones are still receiving.</p><p>Marking: 1 mark each for (a)–(d).</p>"},
{q:"A Web page consists of a base HTML file and 5 small embedded objects, all on the same server. RTT between client and server is 80 ms and object transmission times are negligible. Compute the total time from the click until the page is fully displayed for: (a) non-persistent HTTP with no parallel connections; (b) non-persistent HTTP with 5 parallel connections for the objects; (c) persistent HTTP without pipelining; (d) persistent HTTP with pipelining.",marks:4,co:"CO2",ans:"<p>Each new TCP connection costs 1 RTT for the handshake and each request/response costs 1 RTT.</p><ul><li><b>(a)</b> 6 objects × 2 RTT = 12 RTT = <b>960 ms</b>.</li><li><b>(b)</b> Base file: 2 RTT; then the 5 objects in parallel: 2 RTT. Total 4 RTT = <b>320 ms</b>.</li><li><b>(c)</b> One handshake + base file = 2 RTT; then each of 5 objects sequentially 1 RTT each = 5 RTT. Total 7 RTT = <b>560 ms</b>.</li><li><b>(d)</b> 2 RTT for handshake + base file; then all 5 requests sent back to back = 1 RTT. Total 3 RTT = <b>240 ms</b>.</li></ul><p>1 mark each. Persistent connections avoid repeated handshakes; pipelining avoids waiting for each response.</p>"}
]},
{name:"Part C — Transport layer numeric problems",note:"2 questions × 4 marks = 8 marks.",qs:[
{q:"A stop-and-wait protocol runs between two hosts joined by a 1 Gbps link with one-way propagation delay 15 ms. Packets are 8000 bits long; ACK transmission time is negligible. (a) Compute the sender utilisation and the effective throughput. (b) What window size N is required in a pipelined protocol to reach at least 95% utilisation? (c) How many bits are needed for the sequence number field if Go-Back-N is used with that window?",marks:4,co:"CO2",ans:"<p><b>(a)</b> d<sub>trans</sub> = 8000/10<sup>9</sup> = 8 µs; RTT = 30 ms. U<sub>sender</sub> = (L/R)/(RTT + L/R) = 8×10<sup>−6</sup>/(0.030 + 8×10<sup>−6</sup>) = <b>0.000267 (0.0267%)</b>. Throughput = 8000 bits / 30.008 ms ≈ <b>266.6 kbps</b>, a tiny fraction of the 1 Gbps link. (1.5 marks)</p><p><b>(b)</b> Need N × 8 µs / 30.008 ms ≥ 0.95 ⇒ N ≥ 0.95 × 30.008 ms / 8 µs = 3563.45, so <b>N = 3564 packets</b>. (1.5 marks)</p><p><b>(c)</b> Go-Back-N needs at least N + 1 = 3565 distinct sequence numbers, so ⌈log<sub>2</sub> 3565⌉ = <b>12 bits</b> (4096 values). (1 mark)</p>"},
{q:"A TCP sender uses EstimatedRTT = (1−α)·EstimatedRTT + α·SampleRTT with α = 1/8 and DevRTT = (1−β)·DevRTT + β·|SampleRTT − EstimatedRTT| with β = 1/4 (using the EstimatedRTT value before the update). Initially EstimatedRTT = 100 ms and DevRTT = 10 ms. Three samples arrive: 140 ms, 90 ms, 120 ms. Compute EstimatedRTT, DevRTT and TimeoutInterval (= EstimatedRTT + 4·DevRTT) after each sample, and explain why TimeoutInterval includes a safety margin.",marks:4,co:"CO2",ans:"<table><tr><th>Sample</th><th>EstimatedRTT</th><th>DevRTT</th><th>Timeout</th></tr><tr><td>140</td><td>0.875×100+0.125×140 = 105.0</td><td>0.75×10+0.25×|140−100| = 17.5</td><td>105+70 = <b>175.0 ms</b></td></tr><tr><td>90</td><td>0.875×105+0.125×90 = 103.125</td><td>0.75×17.5+0.25×|90−105| = 16.875</td><td>103.125+67.5 = <b>170.625 ms</b></td></tr><tr><td>120</td><td>0.875×103.125+0.125×120 = 105.234</td><td>0.75×16.875+0.25×|120−103.125| = 16.875</td><td>105.234+67.5 = <b>172.73 ms</b></td></tr></table><p>Marking: 1 mark per row (values), 1 mark for explanation.</p><p><b>Why a margin:</b> EstimatedRTT is only an average; actual RTT fluctuates. The timeout must be larger than the RTT, otherwise premature timeouts cause unnecessary retransmissions; but not too large, otherwise loss recovery is slow. A larger DevRTT (more variation) gives a larger margin. (Samples are not taken for retransmitted segments.)</p>"}
]}
]};</script><script src="../assets/exam.js"></script></main></body></html>
